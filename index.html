<style>
:root {
  --paper: #F4F1EA; --card: #FFFFFF; --ink: #1B1D1F; --muted: #5C5A55; --faint: #8A857A;
  --line: #DAD4C7; --soft: #EEEAE0; --field: #F8F6F1;

  --sans: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;

  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --tabbar: 64px;
  --edge: #BDB6A6; --warn-text: #8A3D10; --danger: #9A2E12;
  --g1: #1F5FAE; --g2: #7C6FB0; --g3: #E0823F; --sky: #2E8FA8; --on-accent: #FFFFFF; --accent: #1F5FAE;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #15171A; --card: #1F2226; --ink: #ECE8E0; --muted: #A39E93; --faint: #7D786E;
  --line: #343840; --soft: #2A2E33; --field: #1A1D20; --edge: #4A4F57;
  --blue: #79A8EC; --blue-soft: #1D3050; --orange: #F2A56E; --orange-soft: #3B2618; --warn-bg: #2D2017;
  --warn-text: #F2B98F; --danger: #F08F72;
  --g1: #79A8EC; --g2: #A99BE0; --g3: #F2A56E; --sky: #6CC3D8; --on-accent: #0E1726; --accent: #79A8EC;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171A; --card: #1F2226; --ink: #ECE8E0; --muted: #A39E93; --faint: #7D786E;
    --line: #343840; --soft: #2A2E33; --field: #1A1D20; --edge: #4A4F57;
    --blue: #79A8EC; --blue-soft: #1D3050; --orange: #F2A56E; --orange-soft: #3B2618; --warn-bg: #2D2017;
    --warn-text: #F2B98F; --danger: #F08F72;
    --g1: #79A8EC; --g2: #A99BE0; --g3: #F2A56E; --sky: #6CC3D8; --on-accent: #0E1726; --accent: #79A8EC;
    color-scheme: dark;
  }
}
.input::placeholder { color: var(--faint); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 var(--sans); -webkit-tap-highlight-color: transparent; }

button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; min-height: 44px; }

.sub { font-size: 13px; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.back { display: inline-flex; align-items: center; min-height: 44px; color: var(--blue); text-decoration: none; font-size: 15px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.pad { padding: 14px; }
.mono { font-family: var(--mono); }
.label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.input { color: var(--ink); height: 44px; border: 1px solid var(--edge); border-radius: 8px; padding: 0 10px; background: var(--card); font-size: 16px; width: 100%; min-width: 0; }
.input.soft { background: var(--field); border-color: var(--line); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.started { font-size: 13px; color: var(--muted); }
.started input { flex: 1; height: 36px; font-size: 14px; }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; min-height: 40px; padding: 0 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
.chip.dark[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.q { display: flex; flex-direction: column; gap: 6px; }
.q > span { font-size: 13px; color: var(--muted); }
.slider-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.slider-top b { font: 500 22px var(--mono); color: var(--ink); }
.slider-top b small { font-size: 13px; color: var(--muted); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--g1), var(--g2) 45%, var(--g3)); }

.effort-word { font: 600 13px var(--sans); padding: 2px 8px; border-radius: 10px; margin-right: 6px; vertical-align: 3px; }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

summary .t span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.badge { width: 32px; height: 32px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.badge svg { width: 18px; height: 18px; }
.b-blue { color: var(--g1); background: color-mix(in srgb, var(--g1) 16%, transparent); }
.b-sky { color: var(--sky); background: color-mix(in srgb, var(--sky) 16%, transparent); }
.b-orange { color: var(--g3); background: color-mix(in srgb, var(--g3) 18%, transparent); }
summary .t { flex: 1; }
.main-card { border-top: 4px solid var(--accent); }

summary .pm::before { content: '+'; }
details[open] > summary .pm::before { content: '−'; }
.dbody { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.group-name { font-size: 12px; font-weight: 600; color: var(--muted); }
.linkbtn { align-self: flex-start; min-height: 36px; padding: 0; border: 0; background: none; color: var(--blue); font-size: 14px; }
.note { font-size: 12px; color: var(--warn-text); background: var(--warn-bg); border-radius: 8px; padding: 8px 10px; }
.hint { font-size: 12px; color: var(--muted); }
#pace-line:empty { display: none; }
.primary { width: 100%; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; }
.primary:disabled { opacity: 0.4; }
.secondary { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--edge); background: var(--card); font-size: 15px; }
.danger { color: var(--danger); }
.err { font-size: 13px; color: var(--danger); }
.err:empty { display: none; }
.inline-add { display: grid; grid-template-columns: 1fr 90px auto; gap: 6px; align-items: end; }
.inline-add.two { grid-template-columns: 1fr auto; }
.toggle { display: flex; justify-content: space-between; align-items: center; min-height: 44px; font-size: 15px; gap: 12px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--ink); flex-shrink: 0; }
.list { display: flex; flex-direction: column; gap: 6px; }
.run-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; text-decoration: none; color: var(--ink); }
.run-row .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.run-row .main b { font-weight: 500; }
.run-row .main span { font-size: 13px; color: var(--muted); }
.run-row .side { text-align: right; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.run-row .side .mono { display: block; font-size: 15px; color: var(--ink); }
.week { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 2px 4px; display: flex; justify-content: space-between; }
.week:first-child { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat { padding: 10px 12px; }
.stat span { font-size: 12px; color: var(--muted); }
.stat b { display: block; font: 500 18px var(--mono); margin-top: 2px; }
.kv { display: flex; justify-content: space-between; gap: 12px; min-height: 40px; align-items: center; border-top: 1px solid var(--soft); font-size: 15px; }
.kv:first-of-type { border-top: 0; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { text-align: right; }
.sym-tag { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--orange); background: var(--orange-soft); font-size: 14px; }
.empty { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty p { margin: 0; color: var(--muted); max-width: 30ch; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 56px; padding: 8px 14px; border-top: 1px solid var(--soft); }
.srow:first-child { border-top: 0; }
.srow .t { display: flex; flex-direction: column; min-width: 0; }
.srow .t span { font-size: 12px; color: var(--muted); }
.sec-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 2px 6px; }
.small-btn { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--card); font-size: 13px; flex-shrink: 0; }
.small-btn.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.tabbar a { flex: 1; max-width: 200px; height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); text-decoration: none; font-size: 11px; }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
[hidden] { display: none !important; }
.lab { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.lab-great { background: var(--g1); color: var(--on-accent); }
.lab-good { background: color-mix(in srgb, var(--g1) 18%, transparent); color: var(--g1); }
.lab-typical { background: var(--soft); color: var(--muted); }
.lab-rough { background: color-mix(in srgb, var(--g3) 20%, transparent); color: var(--orange); }
.lab-bad { background: var(--orange); color: var(--on-accent); }
.lab-none { background: var(--soft); color: var(--faint); font-weight: 500; }
.score-card { display: flex; flex-direction: column; gap: 10px; }
.score-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.score-num { font: 500 40px/1 var(--mono); }
.score-num small { font-size: 15px; color: var(--muted); }
.why { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.why div { display: flex; gap: 8px; align-items: baseline; }
.why div::before { content: ''; width: 6px; height: 6px; border-radius: 3px; background: var(--g2); flex-shrink: 0; transform: translateY(-2px); }
.auto-tag { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); margin-left: 6px; vertical-align: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.grid4 > div { display: flex; flex-direction: column; } .grid4 b { font-size: 15px; font-weight: 500; }
.drv { display: flex; flex-direction: column; gap: 5px; padding-top: 10px; border-top: 1px solid var(--soft); }
.drv-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; }
.drv-top b { font-weight: 500; } .drv-cat { font-size: 11px; color: var(--muted); margin-left: 4px; }
.drv-val { font-size: 14px; font-weight: 500; flex-shrink: 0; }
.drv-sub { font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; } .bar > div { height: 100%; border-radius: 4px; }
.suspect { background: var(--ink); color: var(--paper); border-color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.sus-k { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: color-mix(in srgb, var(--paper) 65%, transparent); }
.sus-t { font: 600 24px/1.15 var(--serif); } .sus-d { font-size: 14px; line-height: 1.45; color: color-mix(in srgb, var(--paper) 88%, transparent); }
.sus-try { margin-top: 4px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--paper) 10%, transparent); font-size: 14px; display: flex; flex-direction: column; gap: 3px; }
.went-right { font-size: 13px; background: var(--blue-soft); border-radius: 10px; padding: 8px 10px; }
a.kv.rec { color: var(--ink); text-decoration: none; }
.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
.gridline { stroke: var(--soft); stroke-width: 1; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
.mini { padding: 10px 12px; }
.cmp-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 8px; align-items: center; min-height: 38px; border-top: 1px solid var(--soft); font-size: 14px; }
.cmp-row > span:first-child { color: var(--muted); }
.cmp-row.hl { background: color-mix(in srgb, var(--g3) 12%, transparent); margin: 0 -14px; padding: 0 14px; border-radius: 6px; }
.cmp-head { border: 0; font-weight: 600; min-height: 28px; } .cmp-head a { color: var(--blue); text-decoration: none; }
.takeaway { font-size: 14px; line-height: 1.45; }
.check { width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--edge); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--on-accent); font-size: 15px; }
.check.on { background: var(--accent); border-color: var(--accent); }
.cmp-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); padding: 10px 14px; background: var(--card); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; justify-content: space-between; z-index: 6; }
.sheet-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }

.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sym-card { border: 1px solid var(--g3); background: var(--warn-bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.4; }
.sym-k { font-size: 12px; font-weight: 600; color: var(--warn-text); }
.map-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 10px; align-items: center; border-top: 1px solid var(--soft); padding-top: 10px; }
.map-src { display: flex; flex-direction: column; min-width: 0; }
.map-src b { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }

.map-row select.input { height: 40px; font-size: 14px; }

.imp-stats span { font-size: 11px; color: var(--muted); }

  <a href="#/runs" data-tab="runs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Runs</a>

  <a href="#/trends" data-tab="trends"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/></svg>Trends</a>

<script>
'use strict';
/* ---------- Storage (IndexedDB) ---------- */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('pacetrack', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('runs', { keyPath: 'id' }); d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {

function bindLog(app, existing) {
  const f = $('#logform');
  ['#f-miles', '#f-time', '#f-hr'].forEach(s => $(s).addEventListener('input', readTimes));
  $('#f-time').addEventListener('blur', e => { const d = parseDuration(e.target.value); if (d) e.target.value = fmtDur(d); });
  $('#f-started').addEventListener('input', () => { form._startedTouched = true; form._startedEdited = true; queueWeather(); });
  $('#f-felt').addEventListener('input', e => { form.felt = +e.target.value; form._feltTouched = true; paintEffort(); });
  paintEffort();
  const ty = $('#f-type'); if (ty) ty.addEventListener('change', e => { form.type = e.target.value; });

  f.addEventListener('click', e => {
    const seg = e.target.closest('[data-seg]');
    if (seg) {
      const [grp, key] = seg.dataset.seg.split('.');
      const val = seg.dataset.val;
      if (seg.dataset.multi) {
        const arr = form[grp][key] || (form[grp][key] = []);
        const i = arr.indexOf(val); i > -1 ? arr.splice(i, 1) : arr.push(val);
        seg.setAttribute('aria-pressed', i === -1);
      } else {
        if (key) form[grp][key] = val; else form[grp] = val;
        $$(`[data-seg="${seg.dataset.seg}"]`, f).forEach(b => b.setAttribute('aria-pressed', b === seg));
        if (grp === 'surface') { if (val !== 'Treadmill') form._lastOutdoor = val; syncIndoor(); }
      }
      updateLogSummaries(); return;
    }
    const sym = e.target.closest('[data-sym]');
    if (sym) {
      const s = sym.dataset.sym, i = form.symptoms.indexOf(s);
      i > -1 ? form.symptoms.splice(i, 1) : form.symptoms.push(s);
      sym.setAttribute('aria-pressed', i === -1); updateLogSummaries(); return;
    }
    const rev = e.target.closest('[data-reveal]');
    if (rev) { const el = $('#' + rev.dataset.reveal); el.hidden = false; rev.hidden = true; el.focus(); }
  });

  f.addEventListener('input', e => {
    const c = e.target.dataset.cond;
    if (c) { const v = e.target.value.trim(); if (v) form.cond[c] = num(v); else delete form.cond[c]; form._condEdited.add(c); updateLogSummaries(); }
  });

  $('#f-route').addEventListener('change', e => {
    if (e.target.value === '__new') { $('#add-route').hidden = false; $('#nr-name').focus(); e.target.value = form.routeId || ''; return; }
    form.routeId = e.target.value; updateLogSummaries();
  });
  $('#nr-add').addEventListener('click', async () => {
    const name = $('#nr-name').value.trim(); if (!name) { $('#nr-name').focus(); return; }
    const r = { id: uid(), name, elev: Math.round(num($('#nr-elev').value)) || 0 };
    routes.push(r); await saveRoutes(); form.routeId = r.id;
    $('#add-route').hidden = true; $('#nr-name').value = ''; $('#nr-elev').value = '';
    fillSelects(); updateLogSummaries(); toast('Route added');
  });
  $('#f-shoes').addEventListener('change', e => {
    if (e.target.value === '__new') { $('#add-shoes').hidden = false; $('#ns-name').focus(); e.target.value = form.shoesId || ''; return; }
    form.shoesId = e.target.value; updateLogSummaries();
  });
  $('#ns-add').addEventListener('click', async () => {
    const name = $('#ns-name').value.trim(); if (!name) { $('#ns-name').focus(); return; }
    const s = { id: uid(), name }; shoes.push(s); await saveShoes(); form.shoesId = s.id;
    $('#add-shoes').hidden = true; $('#ns-name').value = '';
    fillSelects(); updateLogSummaries(); toast('Shoes added');
  });
  $('#f-indoor').addEventListener('change', e => {
    form.surface = e.target.checked ? 'Treadmill' : (form._lastOutdoor || 'Road');
    $$('[data-seg="surface"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.val === form.surface));
    syncIndoor(); updateLogSummaries(); if (!e.target.checked) queueWeather(100);
  });
  $('#f-sick').addEventListener('change', e => { form.sick = e.target.checked; updateLogSummaries(); });

  f.addEventListener('submit', async e => {
    e.preventDefault(); readTimes();
    const err = $('#form-err');
    if (!form.miles || !form.duration) { err.textContent = 'Add miles and time to save this run.'; (form.miles ? $('#f-time') : $('#f-miles')).focus(); return; }
    err.textContent = '';
    const started = new Date($('#f-started').value);
    const run = {
      id: form.id || uid(),
      started: (isNaN(started) ? new Date() : started).toISOString(),
      miles: form.miles, duration: form.duration, hr: form.hr,
      type: form.type || 'Easy', felt: existing && existing.felt == null && !form._feltTouched ? null : form.felt,
      timeUnknown: existing && existing.timeUnknown && !form._startedEdited ? true : undefined,
      pace: existing && existing.pace && existing.miles === form.miles && existing.duration === form.duration ? existing.pace : undefined,
      power: existing ? existing.power : undefined, cadence: existing ? existing.cadence : undefined, notes: existing ? existing.notes : undefined,
      symptoms: form.symptoms.slice(), symptomNote: ($('#f-symnote').value || '').trim(),
      before: form.before, foodNote: ($('#f-foodnote').value || '').trim(),
      indoor: form.surface === 'Treadmill',
      weatherSource: form.surface !== 'Treadmill' && form._condAuto && ['temp', 'humidity', 'dew', 'wind'].some(k => form.cond[k] != null && !form._condEdited.has(k)) ? 'auto' : (existing ? existing.weatherSource : undefined),
      cond: form.surface === 'Treadmill' ? (form.cond.incline != null ? { incline: form.cond.incline } : {}) : (() => { const c = { ...form.cond }; delete c.incline; return c; })(),
      routeId: form.surface === 'Treadmill' ? '' : (form.routeId || ''), surface: form.surface, shoesId: form.shoesId || '', sick: form.sick,
      created: existing ? existing.created : new Date().toISOString(), updated: new Date().toISOString(), source: existing ? existing.source : 'manual'
    };
    await DB.put(run);
    if (existing) toast('Changes saved'); else pendingSheet = run.id;
    location.hash = '#/run/' + run.id;
  });
}

/* ---------- Runs list ---------- */
let runsSort = 'new', cmpMode = false, cmpSel = [];
async function renderRuns(app) {
  const runs = (await DB.runs()).sort((a, b) => b.started.localeCompare(a.started));
  if (!runs.length) {
    app.innerHTML = `<div class="head"><h1>Runs</h1>${GEAR}</div>
      <div class="card empty"><p>No runs yet. Log your first one and it will show up here.</p><a href="#/log" class="secondary" style="display:inline-flex;align-items:center;text-decoration:none">Log a run</a></div>`;
    return;
  }
  const sc = computeScores(runs);
  const row = r => {
    const S = sc[r.id] || {}, on = cmpSel.includes(r.id);
    const inner = `<span class="main"><b>${fmtDay(r.started)}${r.indoor ? ' · Indoor' : ''}${settings.trackTypes && r.type !== 'Easy' ? ' · ' + esc(r.type) : ''}</b>
        <span>${fmtPace(r)} /mi${r.hr ? ' · ' + r.hr + ' bpm' : ''}${r.symptoms && r.symptoms.length ? ' · <span style="color:var(--orange)">' + esc(r.symptoms[0]) + (r.symptoms.length > 1 ? ' +' + (r.symptoms.length - 1) : '') + '</span>' : ''}</span></span>
        <span class="side"><span class="mono">${r.miles.toFixed(2)} <small style="font-size:12px;color:var(--muted)">mi</small></span>${S.label ? `<span class="${labelClass(S.label)}" style="margin-top:4px">${S.label} ${S.score}</span>` : ''}</span>`;
    return cmpMode
      ? `<button class="card run-row" data-pick="${r.id}" aria-pressed="${on}" style="width:100%;text-align:left;font:inherit;color:inherit"><span class="check${on ? ' on' : ''}">${on ? '✓' : ''}</span>${inner}</button>`
      : `<a class="card run-row" href="#/run/${r.id}">${inner}</a>`;
  };
  let html = `<div class="head"><h1>Runs</h1><div class="row"><button class="small-btn${cmpMode ? '' : ' dark'}" id="cmp-toggle" style="min-height:40px">${cmpMode ? 'Cancel' : 'Compare'}</button>${GEAR}</div></div>
    <div class="seg" role="group" aria-label="Sort" style="margin-bottom:10px"><button type="button" data-sort="new" aria-pressed="${runsSort === 'new'}">Newest</button><button type="button" data-sort="best" aria-pressed="${runsSort === 'best'}">Best score</button></div>
    ${cmpMode ? '<div class="hint" style="margin:-2px 2px 8px">Pick two runs to compare.</div>' : ''}<div class="list">`;
  if (runsSort === 'best') {
    html += runs.filter(r => sc[r.id] && sc[r.id].score != null).sort((a, b) => sc[b.id].score - sc[a.id].score).map(row).join('');
  } else {
    const thisWeek = weekStart(new Date()).getTime(), groups = new Map();
    runs.forEach(r => { const k = weekStart(r.started).getTime(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
    for (const [k, list] of groups) {
      const miles = list.reduce((s, r) => s + (r.miles || 0), 0);
      const label = k === thisWeek ? 'This week' : k === thisWeek - 7 * 864e5 ? 'Last week' : 'Week of ' + new Date(k).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      html += `<div class="week"><span>${label}</span><span class="mono" style="font-weight:500">${miles.toFixed(1)} mi</span></div>` + list.map(row).join('');
    }
  }
  html += '</div>';
  if (cmpMode) html += `<div class="cmp-bar"><span class="sub">${cmpSel.length} of 2 picked</span>${cmpSel.length === 2 ? `<a class="small-btn dark" style="display:inline-flex;align-items:center;text-decoration:none;min-height:44px" href="#/compare/${cmpSel[0]}/${cmpSel[1]}" id="cmp-go">Compare</a>` : '<button class="small-btn" disabled style="min-height:44px">Compare</button>'}</div><div style="height:64px"></div>`;
  app.innerHTML = html;
  $('#cmp-toggle').addEventListener('click', () => { cmpMode = !cmpMode; cmpSel = []; renderRuns(app); });
  $$('[data-sort]').forEach(b => b.addEventListener('click', () => { runsSort = b.dataset.sort; renderRuns(app); }));
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.pick, i = cmpSel.indexOf(id);
    if (i > -1) cmpSel.splice(i, 1); else { if (cmpSel.length === 2) cmpSel.shift(); cmpSel.push(id); }
    renderRuns(app);
  }));
  const go = $('#cmp-go'); if (go) go.addEventListener('click', () => { cmpMode = false; cmpSel = []; });
}

/* ---------- Run detail ---------- */
async function renderRun(app, id) {
  const r = await DB.run(id);
  if (!r) { app.innerHTML = `<a class="back" href="#/runs">Runs</a><div class="card empty"><p>This run isn’t on this phone anymore.</p></div>`; return; }
  const rt = routes.find(x => x.id === r.routeId), sh = shoes.find(x => x.id === r.shoesId);
  const bpm = beatsPerMile(r);
  const elev = r.indoor ? null : ((r.cond && r.cond.elev) || (rt && rt.elev));
  const c = r.cond || {};
  const kv = (k, v) => v || v === 0 ? `<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>` : '';
  const S = computeScores(await DB.runs())[r.id] || {};
  const why = [];
  if (S.baseline && S.adj) {
    const better = S.pct < 0;
    const adjusted = Math.abs(S.adj - S.bpm) >= 5;
    why.push(`Beats per mile ${S.adj}${adjusted ? ' (heat-adjusted)' : ''} vs your usual ${S.baseline}: <b style="color:${better ? 'var(--blue)' : 'var(--orange)'}">${Math.abs(S.pct).toFixed(1)}% ${better ? 'better' : 'worse'}</b>`);
    if (adjusted && c.temp != null) { const per10 = Math.round(S.slope * 10); why.push(`Adjusted for ${c.temp}°F: on your runs, every 10°F warmer adds about ${per10} beat${per10 === 1 ? '' : 's'} per mile`); }
  }
  if (r.felt != null && S.usualFelt != null) why.push(`Effort ${r.felt}/10 vs your usual ${S.usualFelt}/10`);
  if (S.vsPrev != null) why.push(`${S.vsPrev >= 0 ? '+' : ''}${S.vsPrev} vs your previous ${r.indoor ? 'indoor ' : ''}run`);
  if (S.load != null) why.push(`Load ratio ${S.load.toFixed(2)}: ${loadWord(S.load)}`);
  const allRuns = await DB.runs(), allSc = computeScores(allRuns), rec = records(allRuns, allSc);
  const links = [];
  if (S.prevId) links.push(`<a class="kv rec" href="#/compare/${S.prevId}/${r.id}"><span>Compare with previous run</span><span style="color:var(--blue)">›</span></a>`);
  if (rec.best && rec.best.id !== r.id) links.push(`<a class="kv rec" href="#/compare/${rec.best.id}/${r.id}"><span>Compare with your best run</span><span style="color:var(--blue)">${allSc[rec.best.id].score} ›</span></a>`);
  const badges = [rec.best && rec.best.id === r.id ? 'Best run' : null, rec.bpm && rec.bpm.id === r.id ? 'Best beats per mile' : null, rec.pace && rec.pace.id === r.id ? 'Fastest pace' : null, rec.long && rec.long.id === r.id ? 'Longest run' : null].filter(Boolean);
  const scoreCard = S.score != null ? `<div class="card pad score-card">
      <div class="score-top"><div><div class="sub">Session score</div><div class="score-num">${S.score}<small>/100</small></div></div><span class="${labelClass(S.label)}" style="font-size:15px;min-height:32px;padding:0 12px">${S.label}</span></div>
      ${why.length ? `<div class="why">${why.map(w => `<div><span>${w}</span></div>`).join('')}</div>` : ''}
      ${S.feelOnly ? '<div class="hint">Scored on effort only, since this run has no heart rate.</div>' : ''}
      ${badges.length ? `<div class="chips">${badges.map(b => `<span class="lab lab-good">★ ${b}</span>`).join('')}</div>` : ''}
      ${links.length ? `<div>${links.join('')}</div>` : ''}
    </div>` : `<div class="card pad"><div class="sub">Session score</div><div style="margin-top:4px">${bpm ? 'Scores start once you have 5 runs with heart rate.' : 'Add average heart rate to score this run.'}</div>${S.load != null ? `<div class="hint" style="margin-top:6px">Load ratio ${S.load.toFixed(2)}: ${loadWord(S.load)}</div>` : ''}</div>`;
  app.innerHTML = `
    <a class="back" href="#/runs">← Runs</a>
    <div class="head" style="align-items:flex-end"><div><div class="sub">${fmtDay(r.started)}${r.timeUnknown ? '' : ' at ' + fmtTime(r.started)}${r.indoor ? ' · Indoor' : ''}${settings.trackTypes ? ' · ' + esc(r.type) : ''}</div><h1>${r.miles.toFixed(2)} miles</h1></div></div>
    <div class="stack">
      ${scoreCard}
      <div class="stats">
        <div class="card stat"><span>Time</span><b>${fmtDur(r.duration)}</b></div>
        <div class="card stat"><span>Pace /mi</span><b>${fmtPace(r)}</b></div>
        <div class="card stat"><span>Avg HR</span><b>${r.hr || '—'}</b></div>
        <div class="card stat"><span>Beats /mi</span><b>${bpm || '—'}</b></div>
        <div class="card stat"><span>Effort</span><b>${r.felt ? r.felt + '/10' : '—'}</b></div>
        ${r.indoor ? `<div class="card stat"><span>Incline</span><b>${r.cond && r.cond.incline != null ? r.cond.incline + '%' : '—'}</b></div>` : `<div class="card stat"><span>Elevation</span><b>${elev ? '+' + elev : '—'}</b></div>`}
      </div>
      ${r.symptoms && r.symptoms.length ? `<div class="card pad stack"><h2>During the run</h2><div class="chips">${r.symptoms.map(s => `<span class="sym-tag">${esc(s)}</span>`).join('')}</div>${r.symptomNote ? `<div class="sub">“${esc(r.symptomNote)}”</div>` : ''}</div>` : ''}
      <div class="card pad"><h2 style="margin-bottom:4px">Before the run</h2>
        ${!r.before || !Object.keys(r.before).length ? '<div class="sub" style="padding-top:4px">Not logged for this run.</div>' : ''}
        ${Object.keys(r.before || {}).length === 0 ? '' : BEFORE.map(b => { const v = r.before && r.before[b.key]; return kv(b.q, Array.isArray(v) ? (v.length ? v.join(', ') : 'Not set') : v); }).join('')}
        ${kv('Food note', r.foodNote)}
      </div>
      <div class="card pad"><h2 style="margin-bottom:4px">Conditions and gear</h2>
        ${r.indoor ? kv('Where', 'Indoor, treadmill') : ''}${kv('Temperature', c.temp != null ? c.temp + '°F' + (r.weatherSource === 'auto' ? ' (auto)' : '') : '')}${kv('Humidity', c.humidity != null ? c.humidity + '%' : '')}${kv('Dew point', c.dew != null ? c.dew + '°F' : '')}${kv('Wind', c.wind != null ? c.wind + ' mph' : '')}
        ${r.indoor ? '' : kv('Route', rt ? rt.name : 'None')}${kv('Surface', r.surface)}${kv('Shoes', sh ? sh.name : '')}${r.sick ? kv('Feeling sick', 'Yes') : ''}${kv('Avg power', r.power ? r.power + ' w' : '')}${kv('Cadence', r.cadence ? r.cadence + ' spm' : '')}${kv('Notes', r.notes)}${r.source === 'import' ? kv('Source', 'Imported') : ''}
      </div>
      <div class="row" style="gap:10px">
        <a class="secondary" href="#/edit/${r.id}" style="color:var(--ink);flex:1;display:inline-flex;align-items:center;justify-content:center;text-decoration:none">Edit run</a>
        <button class="secondary danger" id="del-run" style="flex:1">Delete run</button>
      </div>
    </div>`;
  $('#del-run').addEventListener('click', async () => {
    if (!confirm('Delete this run? This can’t be undone.')) return;
    await DB.del(r.id); toast('Run deleted'); location.hash = '#/runs';
  });
  if (pendingSheet === r.id) { pendingSheet = null; savedSheet(r); }
}

/* ---------- Settings ---------- */
async function renderSettings(app) {
  const runs = await DB.runs();
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let persisted = false;
  try { persisted = navigator.storage && await navigator.storage.persisted(); } catch (e) {}
  const size = new Blob([JSON.stringify(runs)]).size;
  const lastImport = await DB.getMeta('lastImport');
  const missingWx = runs.filter(r => !r.indoor && (!r.cond || r.cond.temp == null)).length;
  app.innerHTML = `
    <a class="back" href="#/log">← Back</a>
    <div class="head"><h1>Settings</h1></div>

    <div class="sec-title">Keep your runs safe</div>
    <div class="card">
      <div class="srow"><span class="t">Home Screen app<span>${standalone ? 'Installed. Safari won’t clear your runs.' : 'In Safari, tap Share, then Add to Home Screen. Without this, Safari can clear your runs after about a week unused.'}</span></span>${standalone ? '<span style="color:var(--blue);font-size:14px">On</span>' : ''}</div>
      <div class="srow"><span class="t">On this phone<span>${runs.length} run${runs.length === 1 ? '' : 's'} · ${(size / 1024).toFixed(1)} KB${persisted ? ' · protected storage' : ''}</span></span></div>
      <div class="srow"><span class="t">Back up now<span>Save a copy to Files or iCloud Drive</span></span><button class="small-btn dark" id="backup">Back up</button></div>
      <div class="srow"><span class="t">Restore<span>From a PaceTrack backup file</span></span><label class="small-btn" style="display:inline-flex;align-items:center">Choose file<input type="file" accept=".json,application/json" id="restore" class="vh"></label></div>
    </div>

    <div class="sec-title">Import and export</div>
    <div class="card">
      <div class="srow"><span class="t">Import running log<span>${lastImport ? 'Last: ' + lastImport.count + ' runs from ' + esc(lastImport.file) : 'From Excel (.xlsx) or CSV'}</span></span><a class="small-btn dark" href="#/import" style="display:inline-flex;align-items:center;text-decoration:none">Import</a></div>
      <div class="srow"><span class="t">Export to Excel<span>Every run and field as a spreadsheet</span></span><button class="small-btn" id="export">Export</button></div>
    </div>

    <div class="sec-title">Weather</div>
    <div class="card">
      <div class="srow"><span class="t">Location<span id="loc-label">${esc(getLoc().label)}</span></span><button class="small-btn" id="loc-btn">Use my location</button></div>
      <div class="srow"><span class="t">Fill in missing weather<span>${missingWx} past run${missingWx === 1 ? '' : 's'} without weather</span></span><button class="small-btn" id="wx-fill" ${missingWx ? '' : 'disabled'}>Fill in</button></div>
      <div class="srow"><span class="t"><span>Weather comes from Open-Meteo. Only your rounded location and the run’s date are sent.</span></span></div>
    </div>

    <div class="sec-title">Appearance</div>
    <div class="card pad"><div class="seg" role="group" aria-label="Appearance">${[['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button type="button" data-theme-opt="${v}" aria-pressed="${settings.theme === v}">${l}</button>`).join('')}</div><div class="hint" style="margin-top:8px">Automatic follows your iPhone’s light or dark setting.</div></div>

    <div class="sec-title">Logging</div>
    <div class="card"><label class="srow toggle" style="margin:0"><span class="t">Track run types<span>${settings.trackTypes ? 'Pick easy, tempo, long and more when logging' : 'Off. Every run is saved as Easy.'}</span></span><input type="checkbox" id="s-types" ${settings.trackTypes ? 'checked' : ''}></label></div>

    <div class="sec-title">Saved routes</div>
    <div class="card">${routes.length ? routes.map(r => `<div class="srow"><span class="t">${esc(r.name)}<span>${r.elev ? '+' + r.elev + ' ft' : 'No elevation set'}</span></span><button class="small-btn danger" data-del-route="${r.id}">Remove</button></div>`).join('') : '<div class="srow"><span class="t"><span>Add routes from the Route list when you log a run.</span></span></div>'}</div>

    <div class="sec-title">Shoes</div>
    <div class="card">${shoes.length ? shoes.map(s => `<div class="srow"><span class="t">${esc(s.name)}<span>${runs.filter(r => r.shoesId === s.id).reduce((a, r) => a + r.miles, 0).toFixed(1)} mi logged</span></span><button class="small-btn danger" data-del-shoe="${s.id}">Remove</button></div>`).join('') : '<div class="srow"><span class="t"><span>Add shoes from the Shoes list when you log a run.</span></span></div>'}</div>

    <div class="sec-title">Data</div>
    <div class="card"><div class="srow"><span class="t">Delete all runs<span>Removes every run from this phone</span></span><button class="small-btn danger" id="wipe">Delete all</button></div></div>
    <p class="hint" style="margin:16px 2px">PaceTrack keeps your runs on this phone only. Nothing is sent to a server.</p>`;

  $$('[data-theme-opt]').forEach(b => b.addEventListener('click', async () => { settings.theme = b.dataset.themeOpt; await saveSettings(); applyTheme(); paintEffort(); $$('[data-theme-opt]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
  $('#s-types').addEventListener('change', async e => { settings.trackTypes = e.target.checked; await saveSettings(); renderSettings(app); });
  $('#backup').addEventListener('click', () => backup(runs));
  $('#export').addEventListener('click', exportExcel);
  $('#loc-btn').addEventListener('click', () => {
    if (!navigator.geolocation) { toast('Location isn’t available on this device'); return; }

      const lat = Math.round(pos.coords.latitude * 100) / 100, lon = Math.round(pos.coords.longitude * 100) / 100;
      settings.loc = { lat, lon, label: `Current location (${lat.toFixed(2)}, ${lon.toFixed(2)})` }; await saveSettings();
      $('#loc-label').textContent = settings.loc.label; toast('Location saved');
    }, () => toast('Couldn’t get your location'), { timeout: 10000, maximumAge: 6e5 });
  });

    const todo = runs.filter(r => !r.indoor && (!r.cond || r.cond.temp == null));

  $$('[data-del-route]').forEach(b => b.addEventListener('click', async () => { if (!confirm('Remove this route? Runs keep their data.')) return; routes = routes.filter(r => r.id !== b.dataset.delRoute); await saveRoutes(); renderSettings(app); }));

}

async function backup(runs) {
  const data = { app: 'PaceTrack', version: 1, exported: new Date().toISOString(), runs, routes, shoes, settings };
  const name = 'pacetrack-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([JSON.stringify(data, null, 1)], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); await DB.setMeta('lastBackup', data.exported); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  await DB.setMeta('lastBackup', data.exported); toast('Backup saved');
}

async function restore(file, app) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'PaceTrack' || !Array.isArray(data.runs)) throw new Error('not a backup');
    if (!confirm(`Restore ${data.runs.length} runs from ${new Date(data.exported).toLocaleDateString()}? Runs already on this phone are kept; matching runs are replaced.`)) return;
    for (const r of data.runs) await DB.put(r);
    const merge = (cur, inc) => { const ids = new Set(cur.map(x => x.id)); return cur.concat((inc || []).filter(x => !ids.has(x.id))); };
    routes = merge(routes, data.routes); shoes = merge(shoes, data.shoes);
    await saveRoutes(); await saveShoes();
    toast('Restored ' + data.runs.length + ' runs'); renderSettings(app);
  } catch (e) { toast('That file isn’t a PaceTrack backup.'); }
}

/* ---------- Weather (Open-Meteo, no account needed) ---------- */
const DEFAULT_LOC = { lat: 40.71, lon: -74.01, label: 'New York, NY' };
const getLoc = () => settings.loc || DEFAULT_LOC;
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const weatherCache = new Map();
async function fetchWeather(when) {
  const loc = getLoc(), day = ymd(when);
  const key = `${loc.lat},${loc.lon},${day}`;
  let data = weatherCache.get(key);
  if (!data) {
    const ageDays = (Date.now() - when.getTime()) / 864e5;
    const host = ageDays > 60 ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
    const q = `?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&start_date=${day}&end_date=${day}`;
    const res = await fetch(host + q);
    if (!res.ok) throw new Error('weather ' + res.status);
    data = await res.json(); weatherCache.set(key, data);
  }
  const h = data.hourly; if (!h || !h.time) throw new Error('no data');
  const hour = String(when.getHours()).padStart(2, '0');
  let i = h.time.findIndex(t => t.endsWith('T' + hour + ':00')); if (i < 0) i = 12;
  const pick = k => h[k] && h[k][i] != null ? h[k][i] : null;
  const out = { temp: pick('temperature_2m'), humidity: pick('relative_humidity_2m'), dew: pick('dew_point_2m'), wind: pick('wind_speed_10m') };
  if (out.temp == null) throw new Error('empty');
  return { temp: Math.round(out.temp), humidity: Math.round(out.humidity), dew: Math.round(out.dew), wind: Math.round(out.wind * 10) / 10 };
}

/* ---------- Scoring ---------- */
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const stdev = a => { if (a.length < 2) return 0; const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)); };
const LABELS = [[75, 'Great'], [60, 'Good'], [40, 'Typical'], [25, 'Rough'], [0, 'Bad']];
const labelFor = s => (LABELS.find(([m]) => s >= m) || LABELS[4])[1];
const groupKey = r => (r.indoor ? 'in' : 'out') + ':' + (settings.trackTypes ? (r.type || 'Easy') : 'Easy');
const dayNum = iso => { const d = new Date(iso); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };

function computeScores(allRuns) {
  const runs = [...allRuns].sort((a, b) => a.started.localeCompare(b.started));
  const out = {}, byGroup = {};
  runs.forEach(r => { (byGroup[groupKey(r)] = byGroup[groupKey(r)] || []).push(r); });
  const models = {};
  for (const [g, list] of Object.entries(byGroup)) {
    const pts = list.filter(r => beatsPerMile(r) && r.cond && r.cond.temp != null && !r.indoor).map(r => [r.cond.temp, beatsPerMile(r)]);
    let slope = 0;
    if (pts.length >= 12) {
      const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length, my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
      const vx = pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
      if (vx > 0) slope = Math.max(0, pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / vx);
    }
    models[g] = { slope, n: pts.length };
  }
  const adjOf = r => { const b = beatsPerMile(r); if (!b) return null; const m = models[groupKey(r)]; const t = r.cond && r.cond.temp; return t != null && !r.indoor ? b - m.slope * (t - 60) : b; };
  const firstDay = runs.length ? dayNum(runs[0].started) : 0;
  runs.forEach((r, idx) => {
    const g = groupKey(r), group = byGroup[g], pos = group.indexOf(r);
    const prior = group.slice(Math.max(0, pos - 20), pos);
    let hist = prior.map(adjOf).filter(v => v != null);
    if (hist.length < 5) hist = group.filter(x => x !== r).map(adjOf).filter(v => v != null);
    const adj = adjOf(r), bpm = beatsPerMile(r);
    const res = { bpm, adj: adj != null ? Math.round(adj) : null, slope: models[g].slope, group: g };
    let eff = null;
    if (adj != null && hist.length >= 5) {
      const base = median(hist), sd = Math.max(stdev(hist), base * 0.02);
      res.baseline = Math.round(base); res.pct = (adj - base) / base * 100;
      eff = Math.max(0, Math.min(100, 50 + 15 * (base - adj) / sd));
    }
    const felts = prior.map(x => x.felt).filter(v => v != null);
    const medFelt = felts.length >= 5 ? median(felts) : 5;
    let feel = null;
    if (r.felt != null) { feel = Math.max(0, Math.min(100, 50 - 12 * (r.felt - medFelt))); res.usualFelt = medFelt; }
    if (eff != null) res.score = Math.round(feel != null ? 0.75 * eff + 0.25 * feel : eff);
    else if (feel != null && hist.length >= 5) { res.score = Math.round(feel); res.feelOnly = true; }
    if (res.score != null) res.label = labelFor(res.score);
    // load ratio
    const d = dayNum(r.started);
    if (d - firstDay >= 21) {
      let acute = 0, chronic = 0, n28 = 0;
      for (const x of runs) { const xd = dayNum(x.started); if (xd > d) break; if (xd > d - 7) acute += x.miles; if (xd > d - 28) { chronic += x.miles; n28++; } }
      if (chronic > 0 && n28 >= 4) res.load = acute / (chronic / 4);
      else if (n28 < 4) res.returning = true;
    }
    // previous similar run
    const prev = group[pos - 1]; if (prev) res.prevId = prev.id;
    out[r.id] = res;
  });
  for (const r of Object.values(out)) if (r.prevId && out[r.prevId] && out[r.prevId].score != null && r.score != null) r.vsPrev = r.score - out[r.prevId].score;
  return out;
}

function runContext(allRuns, scores) {
  const sorted = [...allRuns].sort((a, b) => a.started.localeCompare(b.started)), ctx = {};
  sorted.forEach((r, i) => { const prev = sorted[i - 1]; ctx[r.id] = { load: scores[r.id] && scores[r.id].load, gap: prev ? dayNum(r.started) - dayNum(prev.started) : null, score: scores[r.id] && scores[r.id].score }; });
  return ctx;
}
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;

function scoreDrivers(runs, scores, ctx) {
  const out = [], missing = [];
  for (const f of FACTORS) {
    const bad = [], good = [];
    runs.forEach(r => { const s = ctx[r.id].score; if (s == null) return; const v = f.get(r, ctx[r.id]); if (v === 'bad') bad.push(s); else if (v === 'good') good.push(s); });
    if (bad.length < 3 || good.length < 3) { missing.push({ f, nBad: bad.length, nGood: good.length }); continue; }
    const diff = mean(bad) - mean(good);
    out.push({ f, diff: Math.round(diff), nBad: bad.length, nGood: good.length, early: Math.min(bad.length, good.length) < 5 });
  }
  out.sort((a, b) => a.diff - b.diff);
  return { list: out, missing };
}

function symptomPatterns(runs, ctx, symptom) {
  const withS = runs.filter(r => (r.symptoms || []).includes(symptom)), without = runs.filter(r => !(r.symptoms || []).includes(symptom) && r.source !== 'import');
  const out = [];
  for (const f of FACTORS) {
    const a = withS.map(r => f.get(r, ctx[r.id])).filter(v => v != null), b = without.map(r => f.get(r, ctx[r.id])).filter(v => v != null);
    if (a.length < 2) continue;
    const ra = a.filter(v => v === 'bad').length / a.length, rb = b.length ? b.filter(v => v === 'bad').length / b.length : 0;
    if (ra <= 0) continue;
    out.push({ f, hits: a.filter(v => v === 'bad').length, n: a.length, rate: ra, other: b.length >= 3 ? rb : null, lift: ra - rb });
  }
  out.sort((x, y) => y.lift - x.lift);
  return { list: out, count: withS.length };
}

function records(runs, scores) {
  const withB = runs.filter(r => beatsPerMile(r) && !r.indoor);
  const pick = (arr, fn) => arr.length ? arr.reduce((a, b) => fn(b) < fn(a) ? b : a) : null;
  const scored = runs.filter(r => scores[r.id] && scores[r.id].score != null);
  return {
    best: scored.length ? scored.reduce((a, b) => scores[b.id].score > scores[a.id].score || (scores[b.id].score === scores[a.id].score && b.started > a.started) ? b : a) : null,
    bpm: pick(withB, beatsPerMile), pace: pick(runs.filter(r => !r.indoor), paceSec), long: runs.length ? runs.reduce((a, b) => b.miles > a.miles ? b : a) : null,
  };
}

/* ---------- Trends ---------- */
let trendRange = 90;
function svgLine(points, w, h, yMin, yMax, color, opts = {}) {
  if (!points.length) return '';
  const sx = x => 8 + x * (w - 16), sy = y => h - 6 - (y - yMin) / (yMax - yMin || 1) * (h - 12);
  return `<polyline fill="none" stroke="${color}" stroke-width="${opts.width || 2.5}" stroke-linecap="round" stroke-linejoin="round" ${opts.dash ? 'stroke-dasharray="5 4"' : ''} points="${points.map(p => sx(p[0]).toFixed(1) + ',' + sy(p[1]).toFixed(1)).join(' ')}"/>`;
}
function rolling(vals, n) { return vals.map((_, i) => { const w = vals.slice(Math.max(0, i - n + 1), i + 1).filter(v => v != null); return w.length ? mean(w) : null; }); }

async function renderTrends(app) {
  const runs = (await DB.runs()).sort((a, b) => a.started.localeCompare(b.started));
  const scores = computeScores(runs);
  const from = trendRange ? Date.now() - trendRange * 864e5 : 0;
  const R = runs.filter(r => new Date(r.started).getTime() >= from);
  const head = `<div class="head"><h1>Trends</h1>${GEAR}</div>
    <div class="seg" role="group" aria-label="Range" style="margin-bottom:10px">${[[30, '30 days'], [90, '90 days'], [0, 'All']].map(([v, l]) => `<button type="button" data-range="${v}" aria-pressed="${trendRange === v}">${l}</button>`).join('')}</div>`;
  if (R.length < 2) { app.innerHTML = head + '<div class="card empty"><p>Not enough runs in this range yet.</p></div>'; bindRange(app); return; }
  const W = 340, t0 = new Date(R[0].started).getTime(), t1 = new Date(R[R.length - 1].started).getTime(), span = Math.max(1, t1 - t0);
  const tx = r => (new Date(r.started).getTime() - t0) / span;
  const dateLabels = `<div class="axis"><span>${new Date(t0).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span><span>${new Date(t1).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span></div>`;
  const sx = x => 8 + x * (W - 16);

  // score chart
  const sc = R.filter(r => scores[r.id].score != null);
  const scRoll = rolling(sc.map(r => scores[r.id].score), 5);
  const H1 = 150, syS = y => H1 - 6 - y / 100 * (H1 - 12);
  const LCOL = { Great: 'var(--g1)', Good: 'var(--g1)', Typical: 'var(--faint)', Rough: 'var(--g3)', Bad: 'var(--g3)' };
  const scoreSvg = `<svg viewBox="0 0 ${W} ${H1}" class="chart" role="img" aria-label="Session score over time">
    ${[25, 50, 75].map(y => `<line x1="0" x2="${W}" y1="${syS(y)}" y2="${syS(y)}" class="gridline"/>`).join('')}
    ${svgLine(sc.map((r, i) => [tx(r), scRoll[i]]), W, H1, 0, 100, 'var(--ink)', { width: 2.5 })}
    ${sc.map(r => { const s = scores[r.id]; return `<circle cx="${sx(tx(r)).toFixed(1)}" cy="${syS(s.score).toFixed(1)}" r="4.5" fill="${r.indoor ? 'var(--card)' : LCOL[s.label]}" stroke="${LCOL[s.label]}" stroke-width="2"/>`; }).join('')}
  </svg>`;

  // efficiency chart
  const ef = R.filter(r => !r.indoor && scores[r.id].adj);
  let effSvg = '';
  if (ef.length >= 3) {
    const vals = ef.map(r => scores[r.id].adj), roll = rolling(vals, 5), lo = Math.min(...vals) * 0.98, hi = Math.max(...vals) * 1.02;
    const H2 = 130, sy = y => H2 - 6 - (y - lo) / (hi - lo) * (H2 - 12);
    effSvg = `<svg viewBox="0 0 ${W} ${H2}" class="chart" role="img" aria-label="Heat-adjusted beats per mile over time">
      ${ef.map(r => `<circle cx="${sx(tx(r)).toFixed(1)}" cy="${sy(scores[r.id].adj).toFixed(1)}" r="3.5" fill="var(--faint)" opacity="0.7"/>`).join('')}
      ${svgLine(ef.map((r, i) => [tx(r), roll[i]]), W, H2, lo, hi, 'var(--g1)', { width: 2.5 })}
    </svg><div class="axis"><span>${Math.round(hi)} beats/mi</span><span>${Math.round(lo)}</span></div>`;
    const firstAvg = mean(vals.slice(0, Math.min(5, vals.length))), lastAvg = mean(vals.slice(-5));
    const ch = (lastAvg - firstAvg) / firstAvg * 100;
    effSvg += `<div class="sub" style="margin-top:6px">${Math.abs(ch) < 1 ? 'About the same as' : ch < 0 ? `<b style="color:var(--blue)">${Math.abs(ch).toFixed(1)}% fewer</b> beats per mile than` : `<b style="color:var(--orange)">${ch.toFixed(1)}% more</b> beats per mile than`} at the start of this range. Lower means fitter.</div>`;
  }

  // weekly miles + load
  const weeks = new Map();
  R.forEach(r => { const k = weekStart(r.started).getTime(); weeks.set(k, (weeks.get(k) || 0) + r.miles); });
  const wk = [...weeks.entries()].sort((a, b) => a[0] - b[0]);
  const H3 = 120, maxMi = Math.max(...wk.map(w => w[1])) * 1.15, bw = Math.min(26, (W - 16) / wk.length - 4);
  const wkSvg = `<svg viewBox="0 0 ${W} ${H3}" class="chart" role="img" aria-label="Weekly miles">
    ${wk.map((w, i) => { const x = 8 + (i + 0.5) * (W - 16) / wk.length - bw / 2, h = w[1] / maxMi * (H3 - 20); return `<rect x="${x.toFixed(1)}" y="${(H3 - 14 - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="var(--g2)" opacity="0.8"/>`; }).join('')}
  </svg><div class="axis"><span>${wk.length} weeks</span><span>peak ${Math.max(...wk.map(w => w[1])).toFixed(1)} mi</span></div>`;

  // small multiples
  const small = (label, pts, lo, hi, color) => pts.length >= 2 ? `<div class="card pad mini"><div class="sub">${label}</div><svg viewBox="0 0 150 56" class="chart" aria-hidden="true">${svgLine(pts, 150, 56, lo, hi, color, { width: 2 })}${pts.map(p => `<circle cx="${(8 + p[0] * 134).toFixed(1)}" cy="${(50 - (p[1] - lo) / (hi - lo || 1) * 44).toFixed(1)}" r="2.2" fill="${color}"/>`).join('')}</svg></div>` : `<div class="card pad mini"><div class="sub">${label}</div><div class="hint" style="margin-top:8px">Not logged yet</div></div>`;
  const sleepPts = R.filter(r => SLEEP_H[B(r, 'sleep')]).map(r => [tx(r), SLEEP_H[B(r, 'sleep')]]);
  const feltPts = R.filter(r => r.felt != null).map(r => [tx(r), r.felt]);
  const tempPts = R.filter(r => !r.indoor && r.cond && r.cond.temp != null).map(r => [tx(r), r.cond.temp]);
  const humPts = R.filter(r => !r.indoor && r.cond && r.cond.humidity != null).map(r => [tx(r), r.cond.humidity]);
  const tr = tempPts.map(p => p[1]);

  // symptoms strip
  const symRuns = R.filter(r => r.symptoms && r.symptoms.length);
  const symSvg = `<svg viewBox="0 0 ${W} 22" class="chart" aria-label="Runs with symptoms"><line x1="0" x2="${W}" y1="11" y2="11" class="gridline"/>${symRuns.map(r => `<circle cx="${sx(tx(r)).toFixed(1)}" cy="11" r="5" fill="var(--orange)"><title>${esc(fmtDay(r.started))}: ${esc(r.symptoms.join(', '))}</title></circle>`).join('')}</svg>`;

  app.innerHTML = head + `<div class="stack">
    <div class="card pad"><div class="row" style="justify-content:space-between"><h2>Session score</h2><span class="hint">line = 5-run average${R.some(r => r.indoor) ? ' · hollow = indoor' : ''}</span></div>${scoreSvg}${dateLabels}</div>
    ${effSvg ? `<div class="card pad"><div class="row" style="justify-content:space-between"><h2>Efficiency</h2><span class="hint">outdoor · heat-adjusted</span></div>${effSvg}</div>` : ''}
    <div class="card pad"><h2>Weekly miles</h2>${wkSvg}</div>
    <div class="grid2">
      ${small('Sleep (h)', sleepPts, 4, 9, 'var(--g1)')}
      ${small('Effort (1–10)', feltPts, 1, 10, 'var(--g2)')}
      ${small('Temperature (°F)', tempPts, tr.length ? Math.min(...tr) - 3 : 0, tr.length ? Math.max(...tr) + 3 : 1, 'var(--g3)')}
      ${small('Humidity (%)', humPts, 0, 100, 'var(--sky)')}
    </div>
    <div class="card pad"><div class="row" style="justify-content:space-between"><h2>Symptoms</h2><span class="hint">${symRuns.length} run${symRuns.length === 1 ? '' : 's'}</span></div>${symSvg}${dateLabels}</div>
  </div>`;
  bindRange(app);
}
function bindRange(app) { $$('[data-range]').forEach(b => b.addEventListener('click', () => { trendRange = +b.dataset.range; renderTrends(app); })); }

/* ---------- Compare ---------- */
async function renderCompare(app, idA, idB) {
  const A = await analysis(), a = A.runs.find(r => r.id === idA), b = A.runs.find(r => r.id === idB);
  if (!a || !b) { app.innerHTML = '<a class="back" href="#/runs">← Runs</a><div class="card empty"><p>One of these runs isn’t here anymore.</p></div>'; return; }
  const [x, y] = a.started <= b.started ? [a, b] : [b, a];
  const sx = A.scores[x.id] || {}, sy = A.scores[y.id] || {}, cx = A.ctx[x.id], cy = A.ctx[y.id];
  const fmtD = r => new Date(r.started).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const row = (label, vx, vy, hl) => `<div class="cmp-row${hl ? ' hl' : ''}"><span>${label}</span><span>${vx ?? '—'}</span><span>${vy ?? '—'}</span></div>`;
  const bv = (r, k) => { const v = B(r, k); return Array.isArray(v) ? (v.length ? v.join(', ') : null) : v; };
  const diffNum = (p, q, t) => p != null && q != null && Math.abs(p - q) >= t;
  const elev = r => r.indoor ? null : ((r.cond && r.cond.elev) ?? ((routes.find(z => z.id === r.routeId) || {}).elev));
  const res = [
    row('Score', sx.score != null ? `<span class="${labelClass(sx.label)}">${sx.label} ${sx.score}</span>` : null, sy.score != null ? `<span class="${labelClass(sy.label)}">${sy.label} ${sy.score}</span>` : null, sx.score != null && sy.score != null && Math.abs(sx.score - sy.score) >= 10),
    row('Miles', x.miles.toFixed(2), y.miles.toFixed(2)), row('Pace', fmtPace(x), fmtPace(y), Math.abs((paceSec(x) || 0) - (paceSec(y) || 0)) >= 20),
    row('Avg HR', x.hr, y.hr, diffNum(x.hr, y.hr, 5)), row('Beats /mi', beatsPerMile(x), beatsPerMile(y), diffNum(beatsPerMile(x), beatsPerMile(y), 60)),
    row('Effort', x.felt != null ? x.felt + '/10' : null, y.felt != null ? y.felt + '/10' : null, diffNum(x.felt, y.felt, 2)),
    row('Symptoms', (x.symptoms || []).join(', ') || 'None', (y.symptoms || []).join(', ') || 'None', (x.symptoms || []).join() !== (y.symptoms || []).join()),
  ];
  const diffs = [];
  const drow = (key, label, vx, vy, hl) => { if (hl) diffs.push(key); return row(label, vx, vy, hl); };
  const cat = (key, label) => { const p = bv(x, key), q = bv(y, key); return drow(key, label, p, q, p != null && q != null && p !== q); };
  const tX = x.cond && x.cond.temp, tY = y.cond && y.cond.temp, hX = x.cond && x.cond.humidity, hY = y.cond && y.cond.humidity;
  const inputs = [
    cat('sleep', 'Sleep'), cat('meal', 'Last meal'), cat('mealType', 'Meal type'), cat('caffeine', 'Caffeine'), cat('water', 'Water'), cat('alcohol', 'Alcohol'), cat('soreness', 'Soreness'), cat('stress', 'Stress'),
    drow('load', 'Load ratio', cx.load != null ? cx.load.toFixed(2) : null, cy.load != null ? cy.load.toFixed(2) : null, diffNum(cx.load, cy.load, 0.25)),
    drow('backToBack', 'Days since last run', cx.gap, cy.gap, diffNum(cx.gap, cy.gap, 2)),
    drow('temp', 'Temperature', tX != null ? tX + '°F' : null, tY != null ? tY + '°F' : null, diffNum(tX, tY, 8)),
    drow('humidity', 'Humidity', hX != null ? hX + '%' : null, hY != null ? hY + '%' : null, diffNum(hX, hY, 15)),
    drow('elev', 'Elevation', elev(x) != null ? '+' + elev(x) + ' ft' : null, elev(y) != null ? '+' + elev(y) + ' ft' : null, diffNum(elev(x), elev(y), 80)),
    row('Where', x.indoor ? 'Indoor' : x.surface, y.indoor ? 'Indoor' : y.surface, x.indoor !== y.indoor),
  ];
  const rank = A.drivers.list.map(d => d.f.key), ri = k => { const i = rank.indexOf(k); return i < 0 ? 99 : i; };
  const names = [...diffs].sort((p, q) => ri(p) - ri(q)).map(k => (FACTORS.find(f => f.key === k) || { name: k }).name.toLowerCase());
  app.innerHTML = `<a class="back" href="javascript:history.back()">← Back</a>
    <div class="head"><h1>Compare</h1></div>
    <div class="stack">
      <div class="cmp-row cmp-head"><span></span><a href="#/run/${x.id}">${fmtD(x)}</a><a href="#/run/${y.id}">${fmtD(y)}</a></div>
      <div class="card pad"><div class="group-name">Result</div>${res.join('')}</div>
      <div class="card pad"><div class="group-name">What was different</div>${inputs.join('')}</div>
      <div class="card pad takeaway">${names.length ? `Highlighted rows changed the most. Biggest differences: <b>${esc(names.slice(0, 3).join(', '))}</b>.` : 'These runs had similar conditions going in.'}</div>
    </div>`;
}

    <div class="grab"></div>
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="sub">Saved · ${fmtDay(run.started)}</div><h2 style="font:600 24px var(--serif)">${S.label ? S.label + ' session' : 'Run saved'}</h2></div>
      ${S.score != null ? `<div style="text-align:right"><div class="sub">Score</div><div class="mono" style="font-size:32px;line-height:1">${S.score}</div></div>` : ''}</div>
    ${S.vsPrev != null ? `<div class="sub">${S.vsPrev >= 0 ? '+' : ''}${S.vsPrev} vs your previous run</div>` : S.score == null ? '<div class="sub">Scores start once you have 5 runs with heart rate.</div>' : ''}
    ${cards}${sug}
    <div class="row" style="gap:8px"><button class="secondary" style="flex:1" id="sh-view">View run</button><a class="primary" style="flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none" href="#/runs" id="sh-done">Done</a></div>
  </div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.addEventListener('click', e => { if (e.target === el) close(); });
  $('#sh-view', el).addEventListener('click', close);
  $('#sh-done', el).addEventListener('click', close);
  window.addEventListener('hashchange', close, { once: true });
  $('#sh-view', el).focus();
}

/* ---------- Spreadsheet: zip + xlsx reader/writer (no dependencies) ---------- */
const Sheet = (() => {
  const dv = u8 => new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  async function inflateRaw(u8) {
    const ds = new DecompressionStream('deflate-raw');
    const out = new Response(new Blob([u8]).stream().pipeThrough(ds));
    return new Uint8Array(await out.arrayBuffer());
  }
  async function unzip(buf) {
    const u8 = new Uint8Array(buf), v = dv(u8);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('not a zip');
    const count = v.getUint16(eocd + 10, true); let p = v.getUint32(eocd + 16, true);
    const files = {}, dec = new TextDecoder();
    for (let n = 0; n < count; n++) {
      const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      const nlen = v.getUint16(p + 28, true), elen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
      const off = v.getUint32(p + 42, true), name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      files[name] = { method, csize, off }; p += 46 + nlen + elen + clen;
    }
    return async name => {
      const f = files[name]; if (!f) return null;
      const start = f.off + 30 + v.getUint16(f.off + 26, true) + v.getUint16(f.off + 28, true);
      const data = u8.subarray(start, start + f.csize);
      return dec.decode(f.method === 8 ? await inflateRaw(data) : data);
    };
  }

/* ---------- Import ---------- */
const FIELDS = [
  ['skip', 'Skip'], ['date', 'Date'], ['duration', 'Time (duration)'], ['miles', 'Distance (miles)'], ['km', 'Distance (km)'],
  ['pace', 'Pace (per mile)'], ['pacekm', 'Pace (per km)'], ['hr', 'Avg heart rate'], ['elev', 'Elevation gain (ft)'],
  ['power', 'Power (watts)'], ['cadence', 'Cadence (spm)'], ['temp', 'Temperature (°F)'], ['humidity', 'Humidity'],
  ['wind', 'Wind (mph)'], ['effort', 'Effort (1–10)'], ['notes', 'Notes'],
];
function guessField(h) {
  const s = String(h || '').toLowerCase();
  if (!s) return 'skip';
  if (/beats\s*(per|\/)\s*mile|status|score|split/.test(s)) return 'skip';
  if (/pace/.test(s)) return /km/.test(s) ? 'pacekm' : 'pace';
  if (/date|day/.test(s)) return 'date';
  if (/dist|mileage|\bmiles?\b|\bkm\b|kilomet/.test(s)) return /\bkm\b|kilomet/.test(s) ? 'km' : 'miles';
  if (/heart|\bhr\b|bpm/.test(s)) return 'hr';
  if (/elev|gain|climb|ascent/.test(s)) return 'elev';
  if (/power|watt/.test(s)) return 'power';
  if (/cadence|spm|steps/.test(s)) return 'cadence';
  if (/temp/.test(s)) return 'temp';
  if (/humid/.test(s)) return 'humidity';
  if (/wind/.test(s)) return 'wind';
  if (/effort|rpe|felt/.test(s)) return 'effort';
  if (/note|comment/.test(s)) return 'notes';
  if (/time|duration/.test(s)) return 'duration';
  return 'skip';
}
const cellText = c => c == null ? '' : typeof c.v === 'number' ? String(Math.round(c.v * 1000) / 1000) : String(c.v);
const isTimeFmt = f => /h|s|\[m\]/i.test(f.replace(/"[^"]*"/g, '')) && /:/.test(f);
const isDateFmt = f => { const g = f.replace(/"[^"]*"|\[[^\]]*\]/g, ''); return /[yd]/i.test(g) || (/m/i.test(g) && !/[hs:]/i.test(g)); };
