<!doctype html>
<html lang="en">
<head>

<style>
:root {
  --paper: #F4F1EA; --card: #FFFFFF; --ink: #1B1D1F; --muted: #5C5A55; --faint: #8A857A;
  --line: #DAD4C7; --soft: #EEEAE0; --field: #F8F6F1;
  --blue: #1F5FAE; --blue-soft: #DCE6F3; --orange: #B4541A; --orange-soft: #FBE3D2; --warn-bg: #FBF1E8;
  --sans: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --serif: Fraunces, Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --tabbar: 64px;
  --edge: #BDB6A6; --warn-text: #8A3D10; --danger: #9A2E12;
  --g1: #1F5FAE; --g2: #7C6FB0; --g3: #E0823F; --sky: #2E8FA8; --on-accent: #FFFFFF; --accent: #1F5FAE;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #15171A; --card: #1F2226; --ink: #ECE8E0; --muted: #A39E93; --faint: #7D786E;
  --line: #343840; --soft: #2A2E33; --field: #1A1D20; --edge: #4A4F57;
  --blue: #79A8EC; --blue-soft: #1D3050; --orange: #F2A56E; --orange-soft: #3B2618; --warn-bg: #2D2017;
  --warn-text: #F2B98F; --danger: #F08F72;
  --g1: #79A8EC; --g2: #A99BE0; --g3: #F2A56E; --sky: #6CC3D8; --on-accent: #0E1726; --accent: #79A8EC;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171A; --card: #1F2226; --ink: #ECE8E0; --muted: #A39E93; --faint: #7D786E;
    --line: #343840; --soft: #2A2E33; --field: #1A1D20; --edge: #4A4F57;
    --blue: #79A8EC; --blue-soft: #1D3050; --orange: #F2A56E; --orange-soft: #3B2618; --warn-bg: #2D2017;
    --warn-text: #F2B98F; --danger: #F08F72;
    --g1: #79A8EC; --g2: #A99BE0; --g3: #F2A56E; --sky: #6CC3D8; --on-accent: #0E1726; --accent: #79A8EC;
    color-scheme: dark;
  }
}
.input::placeholder { color: var(--faint); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 var(--sans); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 8px) 14px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 16px); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; min-height: 44px; }
h1 { margin: 0; font: 600 27px/1.1 var(--serif); letter-spacing: -0.01em; }
h2 { margin: 0; font: 600 15px/1.3 var(--sans); }
.sub { font-size: 13px; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.back { display: inline-flex; align-items: center; min-height: 44px; color: var(--blue); text-decoration: none; font-size: 15px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.pad { padding: 14px; }
.mono { font-family: var(--mono); }
.label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.input { color: var(--ink); height: 44px; border: 1px solid var(--edge); border-radius: 8px; padding: 0 10px; background: var(--card); font-size: 16px; width: 100%; min-width: 0; }
.input.soft { background: var(--field); border-color: var(--line); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.started { font-size: 13px; color: var(--muted); }
.started input { flex: 1; height: 36px; font-size: 14px; }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; min-height: 40px; padding: 0 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--edge); background: var(--card); font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
.chip.dark[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.q { display: flex; flex-direction: column; gap: 6px; }
.q > span { font-size: 13px; color: var(--muted); }
.slider-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.slider-top b { font: 500 22px var(--mono); color: var(--ink); }
.slider-top b small { font-size: 13px; color: var(--muted); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--g1), var(--g2) 45%, var(--g3)); }
input[type="range"]::-moz-range-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--g1), var(--g2) 45%, var(--g3)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -10px; border-radius: 50%; background: #FFFFFF; border: 3px solid var(--thumb, var(--g2)); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; border: 3px solid var(--thumb, var(--g2)); }
.effort-word { font: 600 13px var(--sans); padding: 2px 8px; border-radius: 10px; margin-right: 6px; vertical-align: 3px; }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
details.inner { border: 0; border-top: 1px solid var(--soft); border-radius: 0; margin: 0 -14px -14px; }
summary { list-style: none; min-height: 54px; padding: 7px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
summary .t b { font-weight: 600; font-size: 15px; }
summary .t span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
summary .t span.hot { color: var(--orange); font-weight: 500; font-size: 15px; }
.badge { width: 32px; height: 32px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.badge svg { width: 18px; height: 18px; }
.b-blue { color: var(--g1); background: color-mix(in srgb, var(--g1) 16%, transparent); }
.b-sky { color: var(--sky); background: color-mix(in srgb, var(--sky) 16%, transparent); }
.b-orange { color: var(--g3); background: color-mix(in srgb, var(--g3) 18%, transparent); }
summary .t { flex: 1; }
.main-card { border-top: 4px solid var(--accent); }
summary .pm { font-size: 20px; color: var(--muted); width: 20px; text-align: center; }
summary .pm::before { content: '+'; }
details[open] > summary .pm::before { content: '−'; }
.dbody { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.group-name { font-size: 12px; font-weight: 600; color: var(--muted); }
.linkbtn { align-self: flex-start; min-height: 36px; padding: 0; border: 0; background: none; color: var(--blue); font-size: 14px; }
.note { font-size: 12px; color: var(--warn-text); background: var(--warn-bg); border-radius: 8px; padding: 8px 10px; }
.hint { font-size: 12px; color: var(--muted); }
#pace-line:empty { display: none; }
.primary { width: 100%; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; }
.primary:disabled { opacity: 0.4; }
.secondary { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--edge); background: var(--card); font-size: 15px; }
.danger { color: var(--danger); }
.err { font-size: 13px; color: var(--danger); }
.err:empty { display: none; }
.inline-add { display: grid; grid-template-columns: 1fr 90px auto; gap: 6px; align-items: end; }
.inline-add.two { grid-template-columns: 1fr auto; }
.toggle { display: flex; justify-content: space-between; align-items: center; min-height: 44px; font-size: 15px; gap: 12px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--ink); flex-shrink: 0; }
.list { display: flex; flex-direction: column; gap: 6px; }
.run-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; text-decoration: none; color: var(--ink); }
.run-row .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.run-row .main b { font-weight: 500; }
.run-row .main span { font-size: 13px; color: var(--muted); }
.run-row .side { text-align: right; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.run-row .side .mono { display: block; font-size: 15px; color: var(--ink); }
.week { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 2px 4px; display: flex; justify-content: space-between; }
.week:first-child { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat { padding: 10px 12px; }
.stat span { font-size: 12px; color: var(--muted); }
.stat b { display: block; font: 500 18px var(--mono); margin-top: 2px; }
.kv { display: flex; justify-content: space-between; gap: 12px; min-height: 40px; align-items: center; border-top: 1px solid var(--soft); font-size: 15px; }
.kv:first-of-type { border-top: 0; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { text-align: right; }
.sym-tag { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--orange); background: var(--orange-soft); font-size: 14px; }
.empty { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty p { margin: 0; color: var(--muted); max-width: 30ch; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 56px; padding: 8px 14px; border-top: 1px solid var(--soft); }
.srow:first-child { border-top: 0; }
.srow .t { display: flex; flex-direction: column; min-width: 0; }
.srow .t span { font-size: 12px; color: var(--muted); }
.sec-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 2px 6px; }
.small-btn { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--card); font-size: 13px; flex-shrink: 0; }
.small-btn.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.tabbar a { flex: 1; max-width: 200px; height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); text-decoration: none; font-size: 11px; }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
[hidden] { display: none !important; }
.lab { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.lab-great { background: var(--g1); color: var(--on-accent); }
.lab-good { background: color-mix(in srgb, var(--g1) 18%, transparent); color: var(--g1); }
.lab-typical { background: var(--soft); color: var(--muted); }
.lab-rough { background: color-mix(in srgb, var(--g3) 20%, transparent); color: var(--orange); }
.lab-bad { background: var(--orange); color: var(--on-accent); }
.lab-none { background: var(--soft); color: var(--faint); font-weight: 500; }
.score-card { display: flex; flex-direction: column; gap: 10px; }
.score-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.score-num { font: 500 40px/1 var(--mono); }
.score-num small { font-size: 15px; color: var(--muted); }
.why { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.why div { display: flex; gap: 8px; align-items: baseline; }
.why div::before { content: ''; width: 6px; height: 6px; border-radius: 3px; background: var(--g2); flex-shrink: 0; transform: translateY(-2px); }
.auto-tag { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); margin-left: 6px; vertical-align: 2px; }
.map-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 10px; align-items: center; border-top: 1px solid var(--soft); padding-top: 10px; }
.map-src { display: flex; flex-direction: column; min-width: 0; }
.map-src b { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.map-src span { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.map-row select.input { height: 40px; font-size: 14px; }
.imp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.imp-stats div { background: var(--soft); border-radius: 10px; padding: 8px 4px; }
.imp-stats b { display: block; font-size: 20px; font-weight: 500; }
.imp-stats span { font-size: 11px; color: var(--muted); }
.imp-table { overflow-x: auto; }
.imp-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.imp-table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.imp-table td { padding: 6px; border-bottom: 1px solid var(--soft); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<nav class="tabbar" aria-label="Main">
  <a href="#/log" data-tab="log"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log</a>
  <a href="#/runs" data-tab="runs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Runs</a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ---------- Storage (IndexedDB) ---------- */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('pacetrack', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('runs', { keyPath: 'id' }); d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const s = t.objectStore(store);
      const out = fn(s); t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out); t.onerror = () => rej(t.error);
    });
  };
  return {
    runs: () => tx('runs', 'readonly', s => s.getAll()),
    run: id => tx('runs', 'readonly', s => s.get(id)),
    put: run => tx('runs', 'readwrite', s => s.put(run)),
    del: id => tx('runs', 'readwrite', s => s.delete(id)),
    clear: () => tx('runs', 'readwrite', s => s.clear()),
    getMeta: k => tx('meta', 'readonly', s => s.get(k)),
    setMeta: (k, v) => tx('meta', 'readwrite', s => s.put(v, k)),
  };
})();

/* ---------- Options ---------- */
const BEFORE = [
  { key: 'sleep', q: 'Sleep last night', opts: ['<5 h', '5–6', '6–7', '7–8', '8+'], def: '7–8' },
  { key: 'meal', q: 'Last meal before run', opts: ['<1 h', '1–2 h', '2–4 h', '4 h+', 'Fasted'], def: '2–4 h' },
  { key: 'mealType', q: 'What kind of meal', opts: ['Light', 'Heavy', 'Carbs', 'Fatty', 'Fiber'], def: [], multi: true },
  { key: 'caffeine', q: 'Caffeine', opts: ['None', '1 cup', '2+'], def: 'None' },
  { key: 'water', q: 'Water, prior 24 h', opts: ['Low', 'Normal', 'High'], def: 'Normal' },
  { key: 'alcohol', q: 'Alcohol last night', opts: ['None', '1–2', '3+'], def: 'None' },
  { key: 'soreness', q: 'Soreness', opts: ['None', 'Mild', 'Moderate', 'High'], def: 'None' },
  { key: 'stress', q: 'Stress', opts: ['Low', 'Medium', 'High'], def: 'Low' },
];
const SYMPTOMS = [
  ['Breathing and energy', ['Short of breath', 'Low energy', 'Dizzy / lightheaded', 'Overheated']],
  ['Stomach', ['Side stitch', 'Nausea', 'Needed bathroom', 'Heartburn']],
  ['Muscles', ['Cramp', 'Heavy legs', 'Tight calves', 'Tight hamstrings']],
  ['Aches and pain', ['Shin', 'Knee', 'Hip / IT band', 'Foot / heel', 'Achilles', 'Lower back']],
  ['Skin and other', ['Blister', 'Chafing', 'Numb toes', 'Headache']],
];
const TYPES = ['Easy', 'Tempo', 'Long', 'Intervals', 'Race'];
const SURFACES = ['Road', 'Track', 'Trail', 'Treadmill'];

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };

function parseDuration(str) {
  const s = String(str || '').trim(); if (!s) return null;
  let parts;
  if (/[:.]/.test(s)) parts = s.split(/[:.]/).map(p => parseInt(p, 10));
  else {
    const d = s.replace(/\D/g, ''); if (!d) return null;
    if (d.length <= 2) parts = [+d, 0];
    else if (d.length <= 4) parts = [+d.slice(0, -2), +d.slice(-2)];
    else parts = [+d.slice(0, -4), +d.slice(-4, -2), +d.slice(-2)];
  }
  if (parts.some(isNaN)) return null;
  const sec = parts.length === 3 ? parts[0] * 3600 + parts[1] * 60 + parts[2] : parts[0] * 60 + (parts[1] || 0);
  return sec > 0 ? sec : null;
}
const fmtDur = sec => { if (!sec) return '—'; sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const paceSec = r => r.pace || (r.miles && r.duration ? r.duration / r.miles : null);
const fmtPace = r => { const p = paceSec(r); return p ? fmtDur(p) : '—'; };
const beatsPerMile = r => r.hr && paceSec(r) ? Math.round(r.hr * paceSec(r) / 60) : null;
const toLocalInput = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); };
const fmtDay = iso => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

async function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'log';
  const [view, id] = h.split('/');
  const app = $('#app');
  $$('.tabbar a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === (view === 'run' ? 'runs' : view === 'edit' ? 'log' : view === 'import' ? 'settings' : view) ? 'page' : 'false'));
  window.scrollTo(0, 0);
  if (view === 'runs') return renderRuns(app);
  if (view === 'run' && id) return renderRun(app, id);
  if (view === 'settings') return renderSettings(app);
  if (view === 'import') return renderImport(app);
  if (view === 'edit' && id) return renderLog(app, await DB.run(id));
  return renderLog(app);
}

  fillSelects();
  bindLog(app, existing);

function fillSelects() {
  const r = $('#f-route'), s = $('#f-shoes');
  r.innerHTML = `<option value="">No route</option>${routes.map(x => `<option value="${x.id}"${x.id === form.routeId ? ' selected' : ''}>${esc(x.name)}${x.elev ? ` · +${x.elev} ft` : ''}</option>`).join('')}<option value="__new">Add a route…</option>`;
  s.innerHTML = `<option value="">Not set</option>${shoes.map(x => `<option value="${x.id}"${x.id === form.shoesId ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="__new">Add shoes…</option>`;
}

const EFFORT_WORDS = ['Very easy', 'Very easy', 'Easy', 'Easy', 'Moderate', 'Moderate', 'Hard', 'Hard', 'All out', 'All out'];
function hexMix(a, b, t) {
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function effortColor(n) {
  const cs = getComputedStyle(document.documentElement);
  const g1 = cs.getPropertyValue('--g1').trim(), g2 = cs.getPropertyValue('--g2').trim(), g3 = cs.getPropertyValue('--g3').trim();
  const t = (n - 1) / 9;
  return t <= 0.45 ? hexMix(g1, g2, t / 0.45) : hexMix(g2, g3, (t - 0.45) / 0.55);
}
function paintEffort() {
  const el = $('#f-felt'); if (!el) return;
  const n = +el.value, c = effortColor(n);
  el.style.setProperty('--thumb', c);
  $('#felt-val').textContent = n; $('#felt-val').parentNode.style.color = c;
  const w = $('#felt-word'); w.textContent = EFFORT_WORDS[n - 1]; w.style.color = c; w.style.background = c + '26';
}
let wxTimer;
function queueWeather(delay = 700) { clearTimeout(wxTimer); wxTimer = setTimeout(autoWeather, delay); }
async function autoWeather() {
  if (!form || form.surface === 'Treadmill') return;
  const when = new Date($('#f-started').value); if (isNaN(when) || when > new Date(Date.now() + 36e5)) return;
  const st = $('#cond-status');
  try {
    st.textContent = 'Getting weather…';
    const w = await fetchWeather(when);
    let used = false;
    for (const k of ['temp', 'humidity', 'dew', 'wind']) {
      if (form._condEdited.has(k) || w[k] == null) continue;
      form.cond[k] = w[k]; const inp = $(`[data-cond="${k}"]`); if (inp) inp.value = w[k]; used = true;
    }
    if (used) form._condAuto = true;
    st.textContent = `Weather for ${getLoc().label} at ${when.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}. Tap a field to change it.`;
    updateLogSummaries();
  } catch (e) { st.textContent = 'Couldn’t get weather right now. Enter it yourself, or fill it later from Settings.'; }
}
function readTimes() {
  form.miles = num($('#f-miles').value);
  form.duration = parseDuration($('#f-time').value);
  form.hr = Math.round(num($('#f-hr').value)) || null;
  if (!form._startedTouched && form.duration && !form.id) {
    $('#f-started').value = toLocalInput(new Date(Date.now() - form.duration * 1000));
    queueWeather(1200);
  }
  const pl = $('#pace-line');
  if (form.miles && form.duration) {
    const bpm = beatsPerMile(form);
    pl.textContent = `Pace ${fmtPace(form)} /mi${bpm ? ` · ${bpm} beats per mile` : ''}`;
  } else pl.textContent = '';
}

function syncIndoor() {
  const indoor = form.surface === 'Treadmill';
  $('#f-indoor').checked = indoor;
  $('#indoor-fields').hidden = !indoor;
  $('#outdoor-fields').hidden = indoor;
  $('#f-route').closest('label').hidden = indoor;
}
function updateLogSummaries() {
  const ss = $('#sym-sum');
  ss.textContent = form.symptoms.length ? form.symptoms.join(', ') : 'None';
  ss.className = form.symptoms.length ? 'hot' : '';
  if (!form.symptoms.length) ss.style.cssText = 'font-size:15px;font-weight:500;color:var(--ink)'; else ss.style.cssText = '';
  const b = form.before;
  const mt = (b.mealType || []).length ? ' (' + b.mealType.join(', ').toLowerCase() + ')' : '';
  const bp = [];
  if (b.sleep) bp.push(b.sleep + ' sleep');
  if (b.meal) bp.push(b.meal === 'Fasted' ? 'fasted' : 'ate ' + b.meal + ' before' + mt);
  if (b.water) bp.push(b.water.toLowerCase() + ' water');
  $('#before-sum').textContent = bp.length ? bp.join(' · ') : 'Not logged';
  const c = form.cond, parts = [];
  if (form.surface === 'Treadmill') {
    $('#cond-sum').textContent = 'Indoor, no weather' + (c.incline ? ' · ' + c.incline + '% incline' : '');
  }
  if (c.temp) parts.push(c.temp + '°F'); if (c.humidity) parts.push(c.humidity + '% humidity'); if (c.wind) parts.push('wind ' + c.wind + ' mph');
  const rt = routes.find(r => r.id === form.routeId);
  const elev = c.elev || (rt && rt.elev);
  if (elev) parts.push('+' + elev + ' ft');
  if (form.surface !== 'Treadmill') { $('#cond-sum').textContent = parts.length ? parts.join(' · ') : 'Tap to add weather'; const cb = $('#d-cond summary b'); cb.innerHTML = 'Conditions' + (form._condAuto && parts.length ? '<span class="auto-tag">AUTO</span>' : ''); }
  const sh = shoes.find(s => s.id === form.shoesId);
  $('#gear-sum').textContent = [form.surface === 'Treadmill' ? null : (rt ? rt.name : 'No route'), form.surface, sh ? sh.name : null, form.sick ? 'feeling sick' : null].filter(Boolean).join(' · ');
  const elevIn = $('#f-elev'); if (elevIn) elevIn.placeholder = rt && rt.elev ? String(rt.elev) : '';
}

function bindLog(app, existing) {
  const f = $('#logform');
  ['#f-miles', '#f-time', '#f-hr'].forEach(s => $(s).addEventListener('input', readTimes));
  $('#f-time').addEventListener('blur', e => { const d = parseDuration(e.target.value); if (d) e.target.value = fmtDur(d); });
  $('#f-started').addEventListener('input', () => { form._startedTouched = true; form._startedEdited = true; queueWeather(); });
  $('#f-felt').addEventListener('input', e => { form.felt = +e.target.value; form._feltTouched = true; paintEffort(); });
  paintEffort();
  const ty = $('#f-type'); if (ty) ty.addEventListener('change', e => { form.type = e.target.value; });

  f.addEventListener('click', e => {
    const seg = e.target.closest('[data-seg]');
    if (seg) {
      const [grp, key] = seg.dataset.seg.split('.');
      const val = seg.dataset.val;
      if (seg.dataset.multi) {
        const arr = form[grp][key] || (form[grp][key] = []);
        const i = arr.indexOf(val); i > -1 ? arr.splice(i, 1) : arr.push(val);
        seg.setAttribute('aria-pressed', i === -1);
      } else {
        if (key) form[grp][key] = val; else form[grp] = val;
        $$(`[data-seg="${seg.dataset.seg}"]`, f).forEach(b => b.setAttribute('aria-pressed', b === seg));
        if (grp === 'surface') { if (val !== 'Treadmill') form._lastOutdoor = val; syncIndoor(); }
      }
      updateLogSummaries(); return;
    }
    const sym = e.target.closest('[data-sym]');
    if (sym) {
      const s = sym.dataset.sym, i = form.symptoms.indexOf(s);
      i > -1 ? form.symptoms.splice(i, 1) : form.symptoms.push(s);
      sym.setAttribute('aria-pressed', i === -1); updateLogSummaries(); return;
    }
    const rev = e.target.closest('[data-reveal]');
    if (rev) { const el = $('#' + rev.dataset.reveal); el.hidden = false; rev.hidden = true; el.focus(); }
  });

  f.addEventListener('input', e => {
    const c = e.target.dataset.cond;
    if (c) { const v = e.target.value.trim(); if (v) form.cond[c] = num(v); else delete form.cond[c]; form._condEdited.add(c); updateLogSummaries(); }
  });

  $('#f-route').addEventListener('change', e => {
    if (e.target.value === '__new') { $('#add-route').hidden = false; $('#nr-name').focus(); e.target.value = form.routeId || ''; return; }
    form.routeId = e.target.value; updateLogSummaries();
  });
  $('#nr-add').addEventListener('click', async () => {
    const name = $('#nr-name').value.trim(); if (!name) { $('#nr-name').focus(); return; }
    const r = { id: uid(), name, elev: Math.round(num($('#nr-elev').value)) || 0 };
    routes.push(r); await saveRoutes(); form.routeId = r.id;
    $('#add-route').hidden = true; $('#nr-name').value = ''; $('#nr-elev').value = '';
    fillSelects(); updateLogSummaries(); toast('Route added');
  });
  $('#f-shoes').addEventListener('change', e => {
    if (e.target.value === '__new') { $('#add-shoes').hidden = false; $('#ns-name').focus(); e.target.value = form.shoesId || ''; return; }
    form.shoesId = e.target.value; updateLogSummaries();
  });
  $('#ns-add').addEventListener('click', async () => {
    const name = $('#ns-name').value.trim(); if (!name) { $('#ns-name').focus(); return; }
    const s = { id: uid(), name }; shoes.push(s); await saveShoes(); form.shoesId = s.id;
    $('#add-shoes').hidden = true; $('#ns-name').value = '';
    fillSelects(); updateLogSummaries(); toast('Shoes added');
  });
  $('#f-indoor').addEventListener('change', e => {
    form.surface = e.target.checked ? 'Treadmill' : (form._lastOutdoor || 'Road');
    $$('[data-seg="surface"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.val === form.surface));
    syncIndoor(); updateLogSummaries(); if (!e.target.checked) queueWeather(100);
  });
  $('#f-sick').addEventListener('change', e => { form.sick = e.target.checked; updateLogSummaries(); });

  f.addEventListener('submit', async e => {
    e.preventDefault(); readTimes();
    const err = $('#form-err');
    if (!form.miles || !form.duration) { err.textContent = 'Add miles and time to save this run.'; (form.miles ? $('#f-time') : $('#f-miles')).focus(); return; }
    err.textContent = '';
    const started = new Date($('#f-started').value);
    const run = {
      id: form.id || uid(),
      started: (isNaN(started) ? new Date() : started).toISOString(),
      miles: form.miles, duration: form.duration, hr: form.hr,
      type: form.type || 'Easy', felt: existing && existing.felt == null && !form._feltTouched ? null : form.felt,
      timeUnknown: existing && existing.timeUnknown && !form._startedEdited ? true : undefined,
      pace: existing && existing.pace && existing.miles === form.miles && existing.duration === form.duration ? existing.pace : undefined,
      power: existing ? existing.power : undefined, cadence: existing ? existing.cadence : undefined, notes: existing ? existing.notes : undefined,
      symptoms: form.symptoms.slice(), symptomNote: ($('#f-symnote').value || '').trim(),
      before: form.before, foodNote: ($('#f-foodnote').value || '').trim(),
      indoor: form.surface === 'Treadmill',
      weatherSource: form.surface !== 'Treadmill' && form._condAuto && ['temp', 'humidity', 'dew', 'wind'].some(k => form.cond[k] != null && !form._condEdited.has(k)) ? 'auto' : (existing ? existing.weatherSource : undefined),
      cond: form.surface === 'Treadmill' ? (form.cond.incline != null ? { incline: form.cond.incline } : {}) : (() => { const c = { ...form.cond }; delete c.incline; return c; })(),
      routeId: form.surface === 'Treadmill' ? '' : (form.routeId || ''), surface: form.surface, shoesId: form.shoesId || '', sick: form.sick,
      created: existing ? existing.created : new Date().toISOString(), updated: new Date().toISOString(), source: existing ? existing.source : 'manual'
    };
    await DB.put(run);
    toast(existing ? 'Changes saved' : 'Run saved');
    location.hash = '#/run/' + run.id;
  });
}

/* ---------- Runs list ---------- */
async function renderRuns(app) {

async function backup(runs) {
  const data = { app: 'PaceTrack', version: 1, exported: new Date().toISOString(), runs, routes, shoes, settings };
  const name = 'pacetrack-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([JSON.stringify(data, null, 1)], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); await DB.setMeta('lastBackup', data.exported); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  await DB.setMeta('lastBackup', data.exported); toast('Backup saved');
}

async function restore(file, app) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'PaceTrack' || !Array.isArray(data.runs)) throw new Error('not a backup');
    if (!confirm(`Restore ${data.runs.length} runs from ${new Date(data.exported).toLocaleDateString()}? Runs already on this phone are kept; matching runs are replaced.`)) return;
    for (const r of data.runs) await DB.put(r);
    const merge = (cur, inc) => { const ids = new Set(cur.map(x => x.id)); return cur.concat((inc || []).filter(x => !ids.has(x.id))); };
    routes = merge(routes, data.routes); shoes = merge(shoes, data.shoes);
    await saveRoutes(); await saveShoes();
    toast('Restored ' + data.runs.length + ' runs'); renderSettings(app);
  } catch (e) { toast('That file isn’t a PaceTrack backup.'); }
}

/* ---------- Weather (Open-Meteo, no account needed) ---------- */
const DEFAULT_LOC = { lat: 40.71, lon: -74.01, label: 'New York, NY' };
const getLoc = () => settings.loc || DEFAULT_LOC;
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const weatherCache = new Map();
async function fetchWeather(when) {
  const loc = getLoc(), day = ymd(when);
  const key = `${loc.lat},${loc.lon},${day}`;
  let data = weatherCache.get(key);
  if (!data) {
    const ageDays = (Date.now() - when.getTime()) / 864e5;
    const host = ageDays > 60 ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
    const q = `?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&start_date=${day}&end_date=${day}`;
    const res = await fetch(host + q);
    if (!res.ok) throw new Error('weather ' + res.status);
    data = await res.json(); weatherCache.set(key, data);
  }
  const h = data.hourly; if (!h || !h.time) throw new Error('no data');
  const hour = String(when.getHours()).padStart(2, '0');
  let i = h.time.findIndex(t => t.endsWith('T' + hour + ':00')); if (i < 0) i = 12;
  const pick = k => h[k] && h[k][i] != null ? h[k][i] : null;
  const out = { temp: pick('temperature_2m'), humidity: pick('relative_humidity_2m'), dew: pick('dew_point_2m'), wind: pick('wind_speed_10m') };
  if (out.temp == null) throw new Error('empty');
  return { temp: Math.round(out.temp), humidity: Math.round(out.humidity), dew: Math.round(out.dew), wind: Math.round(out.wind * 10) / 10 };
}

/* ---------- Scoring ---------- */
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const stdev = a => { if (a.length < 2) return 0; const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)); };
const LABELS = [[75, 'Great'], [60, 'Good'], [40, 'Typical'], [25, 'Rough'], [0, 'Bad']];
const labelFor = s => (LABELS.find(([m]) => s >= m) || LABELS[4])[1];
const groupKey = r => (r.indoor ? 'in' : 'out') + ':' + (settings.trackTypes ? (r.type || 'Easy') : 'Easy');
const dayNum = iso => { const d = new Date(iso); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };

function computeScores(allRuns) {
  const runs = [...allRuns].sort((a, b) => a.started.localeCompare(b.started));
  const out = {}, byGroup = {};
  runs.forEach(r => { (byGroup[groupKey(r)] = byGroup[groupKey(r)] || []).push(r); });
  const models = {};
  for (const [g, list] of Object.entries(byGroup)) {
    const pts = list.filter(r => beatsPerMile(r) && r.cond && r.cond.temp != null && !r.indoor).map(r => [r.cond.temp, beatsPerMile(r)]);
    let slope = 0;
    if (pts.length >= 12) {
      const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length, my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
      const vx = pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
      if (vx > 0) slope = Math.max(0, pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / vx);
    }
    models[g] = { slope, n: pts.length };
  }
  const adjOf = r => { const b = beatsPerMile(r); if (!b) return null; const m = models[groupKey(r)]; const t = r.cond && r.cond.temp; return t != null && !r.indoor ? b - m.slope * (t - 60) : b; };
  const firstDay = runs.length ? dayNum(runs[0].started) : 0;
  runs.forEach((r, idx) => {
    const g = groupKey(r), group = byGroup[g], pos = group.indexOf(r);
    const prior = group.slice(Math.max(0, pos - 20), pos);
    let hist = prior.map(adjOf).filter(v => v != null);
    if (hist.length < 5) hist = group.filter(x => x !== r).map(adjOf).filter(v => v != null);
    const adj = adjOf(r), bpm = beatsPerMile(r);
    const res = { bpm, adj: adj != null ? Math.round(adj) : null, slope: models[g].slope, group: g };
    let eff = null;

const FIELDS = [

  if (/dist|mileage|\bmiles?\b|\bkm\b|kilomet/.test(s)) return /\bkm\b|kilomet/.test(s) ? 'km' : 'miles';

  if (/elev|gain|climb|ascent/.test(s)) return 'elev';
  if (/power|watt/.test(s)) return 'power';
  if (/cadence|spm|steps/.test(s)) return 'cadence';
  if (/temp/.test(s)) return 'temp';
  if (/humid/.test(s)) return 'humidity';
  if (/wind/.test(s)) return 'wind';

function detectHeader(rows) {
  let best = 0, score = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = rows[i] || [];
    const s = r.filter(c => c && typeof c.v === 'string' && guessField(c.v) !== 'skip').length * 3 + r.filter(c => c && typeof c.v === 'string').length;
    if (s > score) { score = s; best = i; }
  }
  return best;
}

async function pickSheet(i) {
  imp.sheet = i; const rows = imp.sheets[i].rows;
  imp.headerRow = detectHeader(rows);
  const saved = (await DB.getMeta('importMaps')) || {};
  buildColumns(saved);
  renderImportSource(); renderMapping(); renderPreview();
}

function buildColumns(saved) {
  const rows = imp.sheets[imp.sheet].rows, hdr = rows[imp.headerRow] || [];
  imp.columns = [];
  hdr.forEach((c, i) => {
    if (!c || typeof c.v !== 'string') return;
    const sample = rows.slice(imp.headerRow + 1).map(r => r && r[i]).find(Boolean);
    imp.columns.push({ i, header: c.v.trim(), sample, field: guessField(c.v) });
  });
  const sig = imp.columns.map(c => c.header).join('|');
  if (saved[sig]) imp.columns.forEach(c => { if (saved[sig][c.header]) c.field = saved[sig][c.header]; });
  imp.sig = sig;
}

function sampleText(c) {
  if (!c.sample) return '';
  const s = c.sample;

  $('#imp-map').innerHTML = `<div class="card pad stack">
    <div><h2>Match your columns</h2><div class="hint" style="margin-top:4px">Check each guess. Columns set to Skip aren’t imported.</div></div>
    ${imp.columns.map((c, k) => `<div class="map-row"><div class="map-src"><b>${esc(c.header)}</b><span>${esc(sampleText(c))}</span></div>
      <select class="input" data-map="${k}" aria-label="${esc(c.header)} maps to">${FIELDS.map(([v, l]) => `<option value="${v}"${v === c.field ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')}
  </div>`;
  $$('[data-map]').forEach(s => s.addEventListener('change', e => { imp.columns[+e.target.dataset.map].field = e.target.value; renderPreview(); }));
}

function parseRows(existing) {
  const rows = imp.sheets[imp.sheet].rows.slice(imp.headerRow + 1);
  const by = {}; imp.columns.forEach(c => { if (c.field !== 'skip' && !(c.field in by)) by[c.field] = c.i; });
  const out = { ok: [], fixed: [], skipped: [], dups: 0 };
  const seen = existing.map(r => ({ day: new Date(r.started).toDateString(), miles: r.miles }));
  rows.forEach((r, k) => {
    if (!r) return;
    const cell = f => by[f] != null ? r[by[f]] : undefined;
    const mapped = Object.keys(by).map(cell).filter(Boolean);
    if (!mapped.length) return;
    const rowNo = imp.headerRow + 2 + k;
    const date = cellDate(cell('date'));
    if (!date) { out.skipped.push({ rowNo, why: 'no readable date' }); return; }
    let duration = cellSeconds(cell('duration'), false);
    let pace = by.pace != null ? cellSeconds(cell('pace'), true) : by.pacekm != null ? (cellSeconds(cell('pacekm'), true) || 0) * 1.609344 || null : null;
    let miles = by.miles != null ? cellNum(cell('miles')) : by.km != null ? cellNum(cell('km')) * 0.621371 : null;
    let fix = null;
    const badMiles = !(miles > 0 && miles < 200);
    if (badMiles) {
      if (duration && pace) { const raw = cell('miles') || cell('km'); miles = Math.round(duration / pace * 100) / 100; fix = `Distance ${raw ? '“' + (isTimeFmt(raw.fmt) ? fmtDur(raw.v * 86400).replace(/:00$/, '') : cellText(raw)) + '” wasn’t a number' : 'was missing'}, so it’s set to ${miles.toFixed(2)} mi from time ÷ pace.`; }
      else { out.skipped.push({ rowNo, date, why: 'no usable distance' }); return; }
    }
    if (!duration && pace && miles) { duration = Math.round(pace * miles); fix = fix || `Time was missing, so it’s set to ${fmtDur(duration)} from pace × distance.`; }
    if (!duration) { out.skipped.push({ rowNo, date, why: 'no usable time' }); return; }
    if (seen.some(s => s.day === date.toDateString() && Math.abs(s.miles - miles) < 0.03)) { out.dups++; return; }
    const n = f => { const v = cellNum(cell(f)); return isFinite(v) && v !== null ? v : null; };
    let hum = n('humidity'); if (hum != null && hum <= 1) hum = Math.round(hum * 100);
    const cond = {}; const t = n('temp'), el = n('elev'), w = n('wind');
    if (t != null) cond.temp = Math.round(t); if (hum != null) cond.humidity = Math.round(hum); if (el != null) cond.elev = Math.round(el); if (w != null) cond.wind = w;
    const eff = n('effort');
    const run = {
      id: uid(), started: date.toISOString(), timeUnknown: true, miles: Math.round(miles * 100) / 100, duration, pace: pace || null,
      hr: n('hr') ? Math.round(n('hr')) : null, type: 'Easy', felt: eff >= 1 && eff <= 10 ? Math.round(eff) : null,
      symptoms: [], symptomNote: '', before: {}, foodNote: '', indoor: false, cond, routeId: '', surface: 'Road', shoesId: '', sick: false,
      power: n('power') ? Math.round(n('power')) : null, cadence: n('cadence') ? Math.round(n('cadence')) : null,
      notes: cell('notes') ? cellText(cell('notes')) : '', source: 'import', created: new Date().toISOString(), updated: new Date().toISOString()
    };
    seen.push({ day: date.toDateString(), miles: run.miles });
    (fix ? out.fixed : out.ok).push(fix ? { run, rowNo, fix } : run);
  });
  return out;
}

async function renderPreview() {
  const hasDate = imp.columns.some(c => c.field === 'date');
  const hasDist = imp.columns.some(c => ['miles', 'km'].includes(c.field)) || (imp.columns.some(c => c.field === 'duration') && imp.columns.some(c => /^pace/.test(c.field)));
  const box = $('#imp-preview');
  if (!hasDate || !hasDist) { box.innerHTML = `<div class="card pad"><div class="err">Match at least a Date column and a Distance column to continue.</div></div>`; return; }
  const res = parseRows(await DB.runs()); imp.result = res;
  const all = res.ok.concat(res.fixed.map(f => f.run)).sort((a, b) => a.started.localeCompare(b.started));
  const first = all[0], last = all[all.length - 1];
  box.innerHTML = `<div class="card pad stack">
    <h2>Preview</h2>
    <div class="imp-stats">
      <div><b class="mono">${all.length}</b><span>ready</span></div>
      <div><b class="mono">${res.fixed.length}</b><span>fixed</span></div>
      <div><b class="mono">${res.dups}</b><span>already here</span></div>
      <div><b class="mono">${res.skipped.length}</b><span>skipped</span></div>
    </div>
    ${all.length ? `<div class="hint">${fmtDay(first.started)} to ${fmtDay(last.started)} · ${all.reduce((a, r) => a + r.miles, 0).toFixed(1)} miles</div>` : ''}
    ${res.fixed.map(f => `<div class="note">Row ${f.rowNo} (${fmtDay(f.run.started)}): ${esc(f.fix)}</div>`).join('')}
    ${res.skipped.map(s => `<div class="note" style="color:var(--muted);background:var(--soft)">Row ${s.rowNo}${s.date ? ' (' + fmtDay(s.date.toISOString()) + ')' : ''}: skipped, ${esc(s.why)}.</div>`).join('')}
    ${all.length ? `<div class="imp-table"><table><thead><tr><th>Date</th><th>Miles</th><th>Time</th><th>Pace</th><th>HR</th></tr></thead><tbody>${all.slice(-5).reverse().map(r => `<tr><td>${new Date(r.started).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</td><td class="mono">${r.miles.toFixed(2)}</td><td class="mono">${fmtDur(r.duration)}</td><td class="mono">${fmtPace(r)}</td><td class="mono">${r.hr || '—'}</td></tr>`).join('')}</tbody></table><div class="hint" style="margin-top:6px">Latest 5 shown.</div></div>` : ''}
    <div class="hint">Sleep, food and other “before the run” details stay blank on imported runs. Humidity written as a fraction (0.70) is read as 70%.</div>
    <button class="primary" id="imp-go" ${all.length ? '' : 'disabled'}>Import ${all.length} run${all.length === 1 ? '' : 's'}</button>
  </div>`;
  $('#imp-go').addEventListener('click', async () => {
    for (const r of all) await DB.put(r);
    const maps = (await DB.getMeta('importMaps')) || {};
    maps[imp.sig] = Object.fromEntries(imp.columns.map(c => [c.header, c.field]));
    await DB.setMeta('importMaps', maps);
    await DB.setMeta('lastImport', { at: new Date().toISOString(), count: all.length, file: imp.name });
    toast(`Imported ${all.length} runs`); imp = null; location.hash = '#/runs';
  });
}

/* ---------- Export ---------- */
async function exportExcel() {
  const runs = (await DB.runs()).sort((a, b) => a.started.localeCompare(b.started));
  if (!runs.length) { toast('No runs to export yet'); return; }
  const rname = id => (routes.find(r => r.id === id) || {}).name || '';
  const sname = id => (shoes.find(s => s.id === id) || {}).name || '';
  const excelDate = iso => { const d = new Date(iso); return (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) + 25569; };
  const excelTime = iso => { const d = new Date(iso); return (d.getHours() * 3600 + d.getMinutes() * 60) / 86400; };
  const cols = [
    ['Date', 12, 'date', r => excelDate(r.started)], ['Start time', 11, 'time', r => r.timeUnknown ? '' : excelTime(r.started)],
    ['Miles', 8, 'num2', r => r.miles], ['Time', 10, 'dur', r => r.duration / 86400], ['Pace (/mi)', 10, 'pace', r => paceSec(r) / 86400],
    ['Avg HR', 8, 'int', r => r.hr], ['Beats per mile', 13, 'int', r => beatsPerMile(r)], ['Effort (1-10)', 11, 'int', r => r.felt],
    ['Indoor', 8, 'text', r => r.indoor ? 'Yes' : ''], ['Symptoms', 22, 'text', r => (r.symptoms || []).join(', ')], ['Symptom note', 22, 'text', r => r.symptomNote],
    ...BEFORE.map(b => [b.q, 14, 'text', r => { const v = r.before && r.before[b.key]; return Array.isArray(v) ? v.join(', ') : v; }]),
    ['Food note', 20, 'text', r => r.foodNote], ['Temp (F)', 9, 'int', r => r.cond && r.cond.temp], ['Humidity (%)', 11, 'int', r => r.cond && r.cond.humidity],
    ['Dew point (F)', 12, 'int', r => r.cond && r.cond.dew], ['Wind (mph)', 10, 'num1', r => r.cond && r.cond.wind],
    ['Elevation (ft)', 12, 'int', r => (r.cond && r.cond.elev) ?? ((routes.find(x => x.id === r.routeId) || {}).elev || null)], ['Incline (%)', 10, 'num1', r => r.cond && r.cond.incline],
    ['Power (w)', 9, 'int', r => r.power], ['Cadence (spm)', 12, 'int', r => r.cadence],
    ['Route', 16, 'text', r => rname(r.routeId)], ['Surface', 10, 'text', r => r.surface], ['Shoes', 16, 'text', r => sname(r.shoesId)],
    ['Feeling sick', 11, 'text', r => r.sick ? 'Yes' : ''], ['Notes', 24, 'text', r => r.notes], ['Source', 9, 'text', r => r.source === 'import' ? 'Imported' : 'Logged'],
  ];
  const blob = Sheet.writeXlsx('Runs', cols.map(([header, width, style]) => ({ header, width, style })), runs.map(r => cols.map(c => { const v = c[3](r); return v === undefined ? null : v; })));
  const name = 'PaceTrack runs ' + new Date().toISOString().slice(0, 10) + '.xlsx';
  const file = new File([blob], name, { type: blob.type });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Exported ' + runs.length + ' runs');
}

/* ---------- Start ---------- */
(async () => {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  await loadMeta();
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); paintEffort(); });
  window.addEventListener('hashchange', route);
  route();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
